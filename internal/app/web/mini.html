<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TallyBridge Mini</title><link rel="icon" href="/assets/favicon.svg"><style>body{margin:0;background:#0d151c;color:#e6edf3;font:14px Segoe UI,Arial,sans-serif;width:390px;min-height:510px}.wrap{padding:18px}.brand{font-size:10px;letter-spacing:.18em;color:#7bd8bd;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:700;margin:4px 0}.pill{padding:6px 9px;border-radius:20px;background:#203f3a;color:#7bd8bd;font-size:10px;font-weight:700}.card{background:#17232d;border:1px solid #30414e;border-radius:14px;padding:13px;margin-top:10px}.label{font-size:10px;color:#93a7b6;font-weight:700;letter-spacing:.07em}.value{font-size:20px;font-weight:700;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row{display:flex;justify-content:space-between;gap:12px;margin-top:7px}.muted{color:#93a7b6;font-size:12px}button,a.btn{border:0;border-radius:11px;padding:11px 12px;background:#203f3a;color:#7bd8bd;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:#7bd8bd!important;color:#102d26!important}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}#error{color:#ffb3b3;margin-top:8px}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">TALLYBRIDGE</div><div class="title">Mini Mode</div></div><div id="state" class="pill">CHECKING</div></div><div class="grid"><div class="card"><div class="label">TALLY</div><div id="tally" class="value">—</div></div><div class="card"><div class="label">PENDING ORDERS</div><div id="orders" class="value">—</div></div></div><div class="card"><div class="label">COMPANIES</div><div id="companies" class="value" style="font-size:15px">—</div><div id="sync" class="muted"></div></div><div class="card"><div class="label">BRIDGE</div><div class="row"><span>Phone access</span><strong id="phone">—</strong></div><div class="row"><span>Last Tally success</span><strong id="last">—</strong></div></div><div id="error"></div><div class="actions"><button class="primary" id="refresh">Refresh</button><a class="btn" href="/admin">Dashboard</a><a class="btn" href="/admin#diag">Diagnostics</a><button id="restart">Restart Bridge</button></div></div><script src="/assets/mini.js"></script></body></html>
