name: Signed production release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.1.0
        required: true
        default: v2.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      TB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      TB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Require permanent Android signing secrets
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$TB_STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$TB_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$TB_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is missing"; exit 1; }
      - name: Restore release keystore
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tallybridge-release.jks"
          chmod 600 "$RUNNER_TEMP/tallybridge-release.jks"
          echo "TB_KEYSTORE=$RUNNER_TEMP/tallybridge-release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed Android release
        working-directory: android
        shell: bash
        run: |
          gradle --no-daemon test assembleRelease lintRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt
          sha256sum "$APK" > app/build/outputs/apk/release/TallyBridge-Android-SHA256SUMS.txt
          keytool -list -v -keystore "$TB_KEYSTORE" -storepass "$TB_STORE_PASSWORD" -alias "$TB_KEY_ALIAS"             | sed -n '/Alias name:/p;/SHA1:/p;/SHA256:/p' > app/build/outputs/apk/release/TallyBridge-Android-SIGNING-IDENTITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-Android-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/TallyBridge-Android-SHA256SUMS.txt
            android/app/build/outputs/apk/release/TallyBridge-Android-SIGNING-IDENTITY.txt
            android/app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt
          if-no-files-found: error

  windows-release:
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Test backend and prepare signing certificate
        shell: pwsh
        run: |
          go test ./internal/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!$env:WINDOWS_PFX_BASE64 -or !$env:WINDOWS_PFX_PASSWORD) {
            throw 'Production release blocked: trusted Windows code-signing certificate secrets are required.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'tallybridge-code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $cert = Get-PfxCertificate -FilePath $pfx
          if (!$cert -or $cert.NotAfter -le (Get-Date)) { throw 'Production release blocked: Windows signing certificate is missing or expired.' }
          "TB_WINDOWS_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TB_WINDOWS_SIGN_PASSWORD=$env:WINDOWS_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installers with signed embedded payload when configured
        shell: pwsh
        run: |
          ./scripts/Build-Windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem build\*.exe | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content build\TallyBridge-Windows-SHA256SUMS.txt
          "Authenticode signed: $env:WINDOWS_SIGNED" | Set-Content build\TallyBridge-Windows-SIGNING-STATUS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-Windows-Release
          path: |
            build/*.exe
            build/TallyBridge-Windows-SHA256SUMS.txt
            build/TallyBridge-Windows-SIGNING-STATUS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android-release, windows-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p release
          find dist -type f -maxdepth 3 -exec cp {} release/ \;
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
