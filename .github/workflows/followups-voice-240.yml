name: Verify Follow-ups and Voice Order 2.4.0
on:
  push:
    branches: [feature/operations-center-2.4.0]
    paths:
      - scripts/fix_followups_voice_240.py
      - .github/workflows/followups-voice-240.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operations-center-2.4.0
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply guarded hardening
        run: python3 scripts/fix_followups_voice_240.py
      - name: Backend and desktop regression
        run: |
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge
          node --check internal/app/web/admin.js
          node --check internal/app/web/orders.js
          node --check internal/app/web/operations.js
      - name: Android build and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Full Android emulator regression
        timeout-minutes: 12
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tallybridge-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat /tmp/emulator.log || true' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n followfix -k "system-images;android-30;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd followfix -skin 1080x1920 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot > /tmp/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/results.txt
          grep -q 'OK (10 tests)' /tmp/results.txt
      - name: Commit verified source only
        if: success()
        run: |
          git config user.name 'TallyBridge CI'
          git config user.email 'actions@users.noreply.github.com'
          git add android/app/src/main/java/in/tallybridge/app/OrdersActivity.java android/app/src/main/java/in/tallybridge/app/WorkActivity.java internal/app/web/operations.js
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No source changes'; else git commit -m 'Harden follow-ups and multi-item voice orders [ops-followup-final]' && git push origin HEAD:feature/operations-center-2.4.0; fi
