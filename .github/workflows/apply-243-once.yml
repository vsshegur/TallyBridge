name: Apply 2.4.3 repair patch once
on:
  push:
    branches: [fix/orders-insets-responsive-widget-20261005]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orders-insets-responsive-widget-20261005
      - name: Apply remaining 2.4.3 source and verification edits
        shell: python
        run: |
          from pathlib import Path

          p=Path('internal/app/types.go')
          s=p.read_text()
          s=s.replace('const Version = "2.4.2"','const Version = "2.4.3"')
          p.write_text(s)

          p=Path('android/app/src/main/java/in/tallybridge/app/WorkActivity.java')
          s=p.read_text()
          s=s.replace('Install TallyBridge 2.4.2 on Windows','Install TallyBridge 2.4.3 on Windows')
          s=s.replace('Update Windows TallyBridge to 2.4.2, then retry.','Update Windows TallyBridge to 2.4.3, then retry.')
          p.write_text(s)

          p=Path('android/app/src/androidTest/java/in/tallybridge/app/OrdersOfflineTest.java')
          s=p.read_text()
          marker='  capture("21-orders-widget");\n'
          insert='''  capture("21-orders-widget");
          ui(()->{OrdersActivity a=rule.getActivity();assertEquals(R.layout.orders_widget_compact,OrdersWidget.layoutFor(a,150));FrameLayout stage=new FrameLayout(a);stage.setBackgroundColor(Color.rgb(232,237,242));View widget=a.getLayoutInflater().inflate(R.layout.orders_widget_compact,stage,false);((TextView)widget.findViewById(R.id.widget_pending)).setText("2");((TextView)widget.findViewById(R.id.widget_party1)).setText("Mahesh Textiles");int w=Math.round(360*a.getResources().getDisplayMetrics().density),h=Math.round(150*a.getResources().getDisplayMetrics().density);FrameLayout.LayoutParams lp=new FrameLayout.LayoutParams(w,h,Gravity.CENTER);stage.addView(widget,lp);a.setContentView(stage);});
          capture("31-orders-widget-compact");
          '''
          if '31-orders-widget-compact' not in s:
              if marker not in s: raise SystemExit('light widget marker missing')
              s=s.replace(marker,insert,1)
          marker='  capture("25-orders-widget-dark");\n'
          insert='''  capture("25-orders-widget-dark");
          ui(()->{OrdersActivity a=rule.getActivity();assertEquals(R.layout.orders_widget_compact_dark,OrdersWidget.layoutFor(a,150));FrameLayout stage=new FrameLayout(a);stage.setBackgroundColor(Color.rgb(15,22,29));View widget=a.getLayoutInflater().inflate(R.layout.orders_widget_compact_dark,stage,false);((TextView)widget.findViewById(R.id.widget_pending)).setText("2");((TextView)widget.findViewById(R.id.widget_party1)).setText("Mahesh Textiles");int w=Math.round(360*a.getResources().getDisplayMetrics().density),h=Math.round(150*a.getResources().getDisplayMetrics().density);FrameLayout.LayoutParams lp=new FrameLayout.LayoutParams(w,h,Gravity.CENTER);stage.addView(widget,lp);a.setContentView(stage);});
          capture("32-orders-widget-compact-dark");
          '''
          if '32-orders-widget-compact-dark' not in s:
              if marker not in s: raise SystemExit('dark widget marker missing')
              s=s.replace(marker,insert,1)
          p.write_text(s)

          p=Path('.github/workflows/build.yml')
          s=p.read_text()
          old='29-widget-proforma-1x1 30-widget-order-1x1; do'
          new='29-widget-proforma-1x1 30-widget-order-1x1 31-orders-widget-compact 32-orders-widget-compact-dark; do'
          if old in s: s=s.replace(old,new)
          p.write_text(s)
      - name: Commit remaining repair changes
        shell: bash
        run: |
          git config user.name "TallyBridge CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add internal/app/types.go android/app/src/main/java/in/tallybridge/app/WorkActivity.java android/app/src/androidTest/java/in/tallybridge/app/OrdersOfflineTest.java .github/workflows/build.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish 2.4.3 layout and Work verification"
          git push origin HEAD:fix/orders-insets-responsive-widget-20261005
