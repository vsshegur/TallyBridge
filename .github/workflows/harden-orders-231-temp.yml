name: Apply and verify Orders 2.3.1 hardening
on:
  push:
    branches: [hardening/2.3.1-orders]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply guarded source transformations
        run: python3 scripts/harden-orders-231.py
      - name: Verify backend and desktop JavaScript
        run: |
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall
          node --check internal/app/web/admin.js
          node --check internal/app/web/orders.js
      - name: Compile and lint Android including instrumentation tests
        working-directory: android
        run: gradle --no-daemon test assembleDebug assembleDebugAndroidTest lintDebug
      - name: Commit verified hardening only
        run: |
          rm -f scripts/harden-orders-231.py .github/workflows/harden-orders-231-temp.yml
          git config user.name "TallyBridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden offline Orders sync and photo lifecycle for 2.3.1"
          git push origin HEAD:hardening/2.3.1-orders
