name: Verify photo Orders
on:
  push:
    branches: [feature/photo-orders-impl]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test backend and desktop Orders JavaScript
        run: |
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge
          GOOS=windows GOARCH=amd64 go build ./cmd/tallybridge
          node --check internal/app/web/admin.js
          node --check internal/app/web/orders.js
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and lint Android
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Verify photo share on emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tallybridge-photo-orders"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n photoorders -k "system-images;android-30;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd photoorders -skin 1080x1920 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -no-metrics > /tmp/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -e class in.tallybridge.app.PhotoOrderShareTest in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/photo-order-results.txt
          grep -q 'OK (1 test)' /tmp/photo-order-results.txt
          mkdir -p android/photo-order-proof
          adb exec-out run-as in.tallybridge.app cat files/ui/22-photo-order-share.png > android/photo-order-proof/22-photo-order-share.png
          test -s android/photo-order-proof/22-photo-order-share.png
      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Order-Share-Screenshot
          path: android/photo-order-proof/22-photo-order-share.png
          if-no-files-found: error
