name: Build Windows and Android preview
on:
  push:
    branches: [main, production-2.1.0, production-2.1.1-hardening, production-2.1.3-pdf-details]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # only to attach the installer to the private preview release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Windows admin JavaScript
        shell: bash
        run: node --check internal/app/web/admin.js
      - name: Test backend
        shell: pwsh
        run: |
          go test ./internal/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Generate real PDF with Windows browser
        shell: pwsh
        run: |
          $env:TB_PDF_SMOKE = Join-Path $env:RUNNER_TEMP 'tallybridge-invoice.pdf'
          go test ./internal/app -run TestWritePDFSmoke -count=1 -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path $env:TB_PDF_SMOKE)) { throw 'PDF was not created' }
      - name: Verify PDF fallback when first browser creates no file
        shell: pwsh
        run: |
          $stubSource = Join-Path $env:RUNNER_TEMP 'no-pdf-browser.go'
          Set-Content -Path $stubSource -Value 'package main; func main() {}'
          $env:TALLYBRIDGE_PDF_BROWSER = Join-Path $env:RUNNER_TEMP 'no-pdf-browser.exe'
          go build -o $env:TALLYBRIDGE_PDF_BROWSER $stubSource
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:TB_PDF_SMOKE = Join-Path $env:RUNNER_TEMP 'tallybridge-fallback.pdf'
          go test ./internal/app -run TestWritePDFSmoke -count=1 -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path $env:TB_PDF_SMOKE)) { throw 'Fallback PDF was not created' }
      - name: Verify proforma PDF layout
        shell: pwsh
        run: |
          $env:TB_PROFORMA_FIXTURE = Join-Path $env:RUNNER_TEMP 'proforma-verification'
          go test ./internal/app -run TestWriteProformaFixture -count=1 -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # a full artifact store must not stop the build and checks after it
        with:
          retention-days: 14
          name: Proforma-PDF-Verification
          path: ${{ runner.temp }}/proforma-verification/proforma.pdf
          if-no-files-found: error
      - name: Build Windows installers
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      # Release files do not count against Actions artifact storage, so the installer can always be downloaded.
      - name: Attach installer to the preview release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^const Version = "([^"]+)".*/\1/p' internal/app/types.go)
          test -n "$VERSION"
          TAG="preview-$VERSION"
          cp build/TallyBridge_Setup.exe "build/TallyBridge-$VERSION-Setup.exe"
          (cd build && sha256sum "TallyBridge-$VERSION-Setup.exe" > "TallyBridge-$VERSION-Setup.sha256.txt")
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "TallyBridge $VERSION (preview builds)" \
              --notes "Windows installer and Android APK built from main by GitHub Actions. Android APK is unsigned: sign it with the permanent signing kit before installing. See docs/UPDATE_${VERSION//./_}.md." || \
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" "build/TallyBridge-$VERSION-Setup.exe" "build/TallyBridge-$VERSION-Setup.sha256.txt" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # the release above is the download; this copy is a convenience
        with:
          retention-days: 14
          name: TallyBridge-Windows-Preview
          path: build/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test build and lint native Android debug build
        working-directory: android
        run: |
          gradle --no-daemon test assembleDebug lintDebug
          gradle --no-daemon signingReport > app/build/outputs/apk/debug/SIGNING-REPORT.txt
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify packaged debug APK version
        working-directory: android
        run: |
          EXPECTED_CODE=$(sed -nE "s/.*versionCode ([0-9]+).*/\1/p" app/build.gradle | head -1)
          EXPECTED_NAME=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/APK-VERSION.txt
          grep -q "versionCode='$EXPECTED_CODE'" app/build/outputs/apk/debug/APK-VERSION.txt
          grep -q "versionName='$EXPECTED_NAME'" app/build/outputs/apk/debug/APK-VERSION.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # a full artifact store must not stop the build and checks after it
        with:
          retention-days: 14
          name: TallyBridge-Android-Debug-Tests
          path: |
            android/app/build/outputs/apk/debug/SIGNING-REPORT.txt
            android/app/build/outputs/apk/debug/APK-VERSION.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # a full artifact store must not stop the build and checks after it
        if: always()
        with:
          retention-days: 14
          name: Android-Lint-Report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Build visual checks
        working-directory: android
        run: gradle --no-daemon assembleDebugAndroidTest
      - name: Check native layouts on Android emulator
        timeout-minutes: 20
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tallybridge-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat /tmp/emulator.log || true' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n design -k "system-images;android-30;google_apis;x86_64" --force
          test -f "$ANDROID_AVD_HOME/design.ini"
          "$ANDROID_HOME/emulator/emulator" -avd design -skin 1080x1920 -cores 4 -memory 2048 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -no-metrics > /tmp/emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 540 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/design-results.txt
          grep -q 'OK (15 tests)' /tmp/design-results.txt
          mkdir -p android/ui-screenshots
          for screen in 01-unlock 02-overview 03-reports 04-connect 05-dark-overview 06-dark-reports 07-dark-connect 08-dark-appearance 09-outstanding 10-filters 11-sync 12-proforma 13-proforma-totals 14-proforma-review 15-payments 16-health 17-diagnostics 18-more 19-orders-offline 20-orders-details-only 21-orders-widget 22-photo-order-share 23-orders-dark 24-orders-dispatched-dark 25-orders-widget-dark 26-work-today 27-work-today-dark 28-work-pc-off 29-widget-proforma-1x1 30-widget-order-1x1 31-orders-widget-compact 32-orders-widget-compact-dark 33-widget-gsm-1x1 34-widget-search-1x1 35-widget-voice-order-1x1 36-widget-quick-dock-5x1 37-widget-quick-dock-small 38-widget-scan-bill-1x1 39-parties 40-widgets 41-overview-bottom 42-order-form 43-order-form-dark 44-dark-parties 45-dark-more 46-dark-widgets 47-outstanding-light 48-sync-light 49-search-pc-off 50-search 51-search-dark 52-customer 53-customer-dark 54-gsm 55-gsm-dark 56-scan-bill 57-scan-bill-dark; do
            adb exec-out run-as in.tallybridge.app cat "files/ui/$screen.png" > "android/ui-screenshots/$screen.png"
            test -s "android/ui-screenshots/$screen.png"
          done
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # a full artifact store must not stop the build and checks after it
        if: always()
        with:
          retention-days: 14
          name: Android-Design-Screenshots
          path: android/ui-screenshots/*.png
          if-no-files-found: ignore
