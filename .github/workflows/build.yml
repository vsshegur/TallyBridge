name: Build Windows and Android preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Test backend
        shell: pwsh
        run: |
          go test ./internal/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows installers
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-Windows-Preview
          path: build/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint native Android
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug lintDebug
          gradle --no-daemon signingReport > app/build/outputs/apk/debug/SIGNING-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-Android-Preview
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SIGNING-REPORT.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Lint-Report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Build visual checks
        working-directory: android
        run: gradle --no-daemon assembleDebugAndroidTest
      - name: Check native layouts on Android emulator
        timeout-minutes: 12
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          trap 'cat /tmp/emulator.log || true' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n design -k "system-images;android-30;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd design -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot > /tmp/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/design-results.txt
          grep -q 'OK (1 test)' /tmp/design-results.txt
          adb pull /sdcard/Android/data/in.tallybridge.app/files/ui android/ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Design-Screenshots
          path: android/ui-screenshots/*.png
          if-no-files-found: ignore
