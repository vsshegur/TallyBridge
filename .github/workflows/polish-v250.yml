name: Polish TallyBridge 2.5.0 interactions
on:
  push:
    branches: [upgrade-2.5.0]
    paths: ['.github/workflows/polish-v250.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: upgrade-2.5.0}
      - name: Apply interaction polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path,old,new):
            p=Path(path);s=p.read_text(encoding='utf-8')
            if old not in s: raise SystemExit(f'missing pattern in {path}')
            p.write_text(s.replace(old,new,1),encoding='utf-8')
          rep('android/app/src/main/java/in/tallybridge/app/OrdersWidget.java','private static PendingIntent refresh(Context c,int id){','private static PendingIntent template(Context c,int req,Intent i){return PendingIntent.getActivity(c,req,i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_MUTABLE);}\n private static PendingIntent refresh(Context c,int id){')
          rep('android/app/src/main/java/in/tallybridge/app/OrdersWidget.java','v.setPendingIntentTemplate(R.id.widget_orders_list,activity(c,6400+id,new Intent(c,OrdersActivity.class)));','v.setPendingIntentTemplate(R.id.widget_orders_list,template(c,6400+id,new Intent(c,OrdersActivity.class)));')
          rep('android/app/src/main/java/in/tallybridge/app/OrdersActivity.java','setPositiveButton("Share",(d,w)->{Intent i=new Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT,text);startActivity(Intent.createChooser(i,"Share order details"));})','setPositiveButton("Share",(d,w)->ShareCenter.shareText(this,"Share order details",text))')
          rep('android/app/src/main/java/in/tallybridge/app/MainActivity.java','private void shareText(String text){try{Intent i=new Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT,text);startActivity(Intent.createChooser(i,"Share details"));}catch(Exception e){toast("No sharing app available");}}','private void shareText(String text){ShareCenter.shareText(this,"Share details",text);}')
          PY
      - name: Commit polish
        run: |
          git config user.name "Vipul Shegur"
          git config user.email "vsshegur@gmail.com"
          git add -A
          git commit -m "Polish 2.5 sharing and widget row actions"
          git push origin upgrade-2.5.0
