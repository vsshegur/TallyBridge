          Path('internal/app/sync_company_test.go').write_text('''package app\n\nimport (\n "net/http"\n "net/http/httptest"\n "strings"\n "testing"\n)\n\nfunc TestFilterSyncCompaniesHonorsExclusionsCaseInsensitively(t *testing.T) {\n cfg:=Settings{SyncExcludedCompanies:[]string{"Vipul Textiles"}}\n got:=filterSyncCompanies([]Company{{Name:"Vijayalaxmi Textiles"},{Name:"VIPUL TEXTILES"},{Name:"Vipul Textiles"}},cfg)\n if len(got)!=1 || got[0].Name!="Vijayalaxmi Textiles" { t.Fatalf("unexpected filtered companies: %#v",got) }\n if companySyncEnabled(cfg,"vipul textiles") { t.Fatal("excluded company should be disabled") }\n}\n\nfunc TestCompanySyncEndpointPersistsRemoveAndRestore(t *testing.T) {\n s,err:=NewServer(t.TempDir());if err!=nil{t.Fatal(err)}\n call:=func(enabled bool){\n  body:=`{"company":"Vipul Textiles","enabled":`+map[bool]string{true:"true",false:"false"}[enabled]+`}`\n  req:=httptest.NewRequest(http.MethodPost,"/api/v1/admin/company-sync",strings.NewReader(body));rr:=httptest.NewRecorder();s.handleCompanySync(rr,req)\n  if rr.Code!=http.StatusOK { t.Fatalf("status %d: %s",rr.Code,rr.Body.String()) }\n }\n call(false);if companySyncEnabled(s.store.Settings(),"VIPUL TEXTILES"){t.Fatal("company should be excluded after removal")}\n call(true);if !companySyncEnabled(s.store.Settings(),"vipul textiles"){t.Fatal("company should be enabled after restore")}\n}\n''',encoding='utf-8')
