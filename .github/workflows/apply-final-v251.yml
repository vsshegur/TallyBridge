name: Apply TallyBridge 2.5.1 final polish
on:
  push:
    branches: [final-2.5.1]
    paths: ['.github/workflows/apply-final-v251.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-2.5.1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply backend and Android final changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(label+' anchor missing')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('internal/app/types.go');s=p.read_text(encoding='utf-8')
          if 'const Version = "2.5.0"' not in s: raise SystemExit('version anchor missing')
          s=s.replace('const Version = "2.5.0"','const Version = "2.5.1"',1)
          old='\tAutoUpdate  bool   `json:"autoUpdate"`\n}'
          new='\tAutoUpdate  bool   `json:"autoUpdate"`\n\tSyncExcludedCompanies []string `json:"syncExcludedCompanies,omitempty"`\n}'
          if old not in s: raise SystemExit('settings anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          one('internal/app/store.go','''\t\t\tif json.Unmarshal(b, &raw) == nil {\n\t\t\t\tif _, ok := raw["autoUpdate"]; ok {\n\t\t\t\t\ts.settings.AutoUpdate = x.AutoUpdate\n\t\t\t\t}\n\t\t\t}\n\t\t}\n''','''\t\t\tif json.Unmarshal(b, &raw) == nil {\n\t\t\t\tif _, ok := raw["autoUpdate"]; ok {\n\t\t\t\t\ts.settings.AutoUpdate = x.AutoUpdate\n\t\t\t\t}\n\t\t\t}\n\t\t\ts.settings.SyncExcludedCompanies = append([]string(nil), x.SyncExcludedCompanies...)\n\t\t}\n''','store exclusions')

          p=Path('internal/app/autosync.go');s=p.read_text(encoding='utf-8')
          anchor='func (s *Server) setAuto(fn func(*AutoSyncState)) { s.mu.Lock(); fn(&s.auto); s.mu.Unlock() }\n'
          helper='''func (s *Server) setAuto(fn func(*AutoSyncState)) { s.mu.Lock(); fn(&s.auto); s.mu.Unlock() }\nfunc companySyncEnabled(cfg Settings, name string) bool {\n\ttarget := strings.TrimSpace(name)\n\tif target == "" { return false }\n\tfor _, x := range cfg.SyncExcludedCompanies { if strings.EqualFold(strings.TrimSpace(x), target) { return false } }\n\treturn true\n}\nfunc filterSyncCompanies(companies []Company, cfg Settings) []Company {\n\tout := make([]Company,0,len(companies)); seen:=map[string]bool{}\n\tfor _, c := range companies { name:=strings.TrimSpace(c.Name); key:=strings.ToLower(name); if name=="" || seen[key] || !companySyncEnabled(cfg,name) { continue }; c.Name=name; out=append(out,c); seen[key]=true }\n\treturn out\n}\nfunc (s *Server) syncCompanyEnabled(name string) bool { return companySyncEnabled(s.store.Settings(), name) }\n'''
          if anchor not in s: raise SystemExit('autosync helper anchor missing')
          s=s.replace(anchor,helper,1)
          old='func (s *Server) startAutoSync(company, reason string) bool {\n\ts.mu.Lock()'
          new='func (s *Server) startAutoSync(company, reason string) bool {\n\tcompany = strings.TrimSpace(company)\n\tif company != "" && !s.syncCompanyEnabled(company) { return false }\n\ts.mu.Lock()'
          if old not in s: raise SystemExit('startAutoSync anchor missing')
          s=s.replace(old,new,1).replace('\tcompanies := []string{}\n','\tcompanies := []string{}\n\tdiscovered := 0\n',1)
          old='''\t\tfor _, c := range st.Companies {\n\t\t\tif c.Name != "" {\n\t\t\t\tcompanies = append(companies, c.Name)\n\t\t\t}\n\t\t}\n'''
          new='''\t\tfor _, c := range st.Companies {\n\t\t\tif strings.TrimSpace(c.Name) != "" { discovered++; if s.syncCompanyEnabled(c.Name) { companies=append(companies,strings.TrimSpace(c.Name)) } }\n\t\t}\n'''
          if old not in s: raise SystemExit('autosync loop anchor missing')
          s=s.replace(old,new,1)
          old='''\tif len(companies) == 0 {\n\t\ts.setAuto(func(a *AutoSyncState) {\n\t\t\ta.LastError = "No open Tally company detected yet"\n'''
          new='''\tif len(companies) == 0 {\n\t\ts.setAuto(func(a *AutoSyncState) {\n\t\t\tif discovered > 0 { a.LastError = "No companies are enabled for automatic sync" } else { a.LastError = "No open Tally company detected yet" }\n'''
          if old not in s: raise SystemExit('autosync empty anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('internal/app/server.go');s=p.read_text(encoding='utf-8')
          route='\tm.HandleFunc("/api/v1/admin/settings", s.localAdmin(s.handleSettings))\n'
          if route not in s: raise SystemExit('server route anchor missing')
          s=s.replace(route,route+'\tm.HandleFunc("/api/v1/admin/company-sync", s.localAdmin(s.handleCompanySync))\n',1)
          marker='func (s *Server) handleAdminSync(w http.ResponseWriter, r *http.Request) {'
          handler='''func (s *Server) handleCompanySync(w http.ResponseWriter, r *http.Request) {\n\tif r.Method != http.MethodPost { jsonErr(w,405,errors.New("POST required")); return }\n\tvar q struct { Company string `json:"company"`; Enabled bool `json:"enabled"` }\n\tif readJSON(r,&q)!=nil { jsonErr(w,400,errors.New("invalid company sync request")); return }\n\tname:=strings.TrimSpace(q.Company); if name=="" { jsonErr(w,400,errors.New("company is required")); return }\n\tcfg:=s.store.Settings(); next:=make([]string,0,len(cfg.SyncExcludedCompanies)+1)\n\tfor _,x:=range cfg.SyncExcludedCompanies { x=strings.TrimSpace(x); if x!="" && !strings.EqualFold(x,name) { next=append(next,x) } }\n\tif !q.Enabled { next=append(next,name) }\n\tsort.Slice(next,func(i,j int)bool{return strings.ToLower(next[i])<strings.ToLower(next[j])}); cfg.SyncExcludedCompanies=next\n\tif e:=s.store.UpdateSettings(cfg);e!=nil { jsonErr(w,500,e); return }\n\tjsonOut(w,map[string]any{"ok":true,"company":name,"enabled":q.Enabled,"syncExcludedCompanies":next})\n}\n'''
          if marker not in s: raise SystemExit('admin sync marker missing')
          s=s.replace(marker,handler+marker,1)
          old='\t_ = readJSON(r, &q)\n\tstarted := s.startAutoSync(q.Company, "desktop")'
          new='\t_ = readJSON(r, &q)\n\tif strings.TrimSpace(q.Company) != "" && !s.syncCompanyEnabled(q.Company) { jsonErr(w,409,errors.New("company is excluded from sync; add it back in Companies")); return }\n\tstarted := s.startAutoSync(q.Company, "desktop")'
          if old not in s: raise SystemExit('admin explicit sync anchor missing')
          s=s.replace(old,new,1)
          old='''func (s *Server) bootstrapPayload() map[string]any {\n\tst := s.stateSnapshot()\n\tcc, _ := s.cache.Companies()\n\tcs := st.Companies\n\tif len(cs) == 0 {\n\t\tcs = cc\n\t}\n'''
          new='''func (s *Server) bootstrapPayload() map[string]any {\n\tst := s.stateSnapshot()\n\tcc, _ := s.cache.Companies()\n\tcfg := s.store.Settings()\n\tcs := filterSyncCompanies(st.Companies, cfg)\n\tif len(cs) == 0 { cs = filterSyncCompanies(cc, cfg) }\n'''
          if old not in s: raise SystemExit('bootstrap anchor missing')
          s=s.replace(old,new,1)
          a=s.index('func (s *Server) bootstrapPayload()');b=s.index('func (s *Server) handleBootstrap',a);seg=s[a:b]
          dup='\tcfg := s.store.Settings()\n\tif cfg.AutoUpdate {'
          if seg.count(dup)!=1: raise SystemExit('bootstrap cfg anchor count='+str(seg.count(dup)))
          seg=seg.replace(dup,'\tif cfg.AutoUpdate {',1);s=s[:a]+seg+s[b:]
          mobile='\t_ = readJSON(r, &q)\n\tstarted := s.startAutoSync(q.Company, q.Reason)'
          mobileNew='\t_ = readJSON(r, &q)\n\tif strings.TrimSpace(q.Company) != "" && !s.syncCompanyEnabled(q.Company) { jsonErr(w,409,errors.New("company is excluded from sync on the Windows app")); return }\n\tstarted := s.startAutoSync(q.Company, q.Reason)'
          if mobile not in s: raise SystemExit('mobile explicit sync anchor missing')
          p.write_text(s.replace(mobile,mobileNew,1),encoding='utf-8')

          Path('internal/app/sync_company_test.go').write_text('''package app\nimport("net/http";"net/http/httptest";"strings";"testing")\nfunc TestFilterSyncCompaniesHonorsExclusionsCaseInsensitively(t *testing.T){cfg:=Settings{SyncExcludedCompanies:[]string{"Vipul Textiles"}};got:=filterSyncCompanies([]Company{{Name:"Vijayalaxmi Textiles"},{Name:"VIPUL TEXTILES"},{Name:"Vipul Textiles"}},cfg);if len(got)!=1||got[0].Name!="Vijayalaxmi Textiles"{t.Fatalf("unexpected: %#v",got)};if companySyncEnabled(cfg,"vipul textiles"){t.Fatal("excluded company enabled")}}\nfunc TestCompanySyncEndpointPersistsRemoveAndRestore(t *testing.T){s,e:=NewServer(t.TempDir());if e!=nil{t.Fatal(e)};call:=func(enabled bool){v:="false";if enabled{v="true"};req:=httptest.NewRequest(http.MethodPost,"/api/v1/admin/company-sync",strings.NewReader(`{"company":"Vipul Textiles","enabled":`+v+`}`));rr:=httptest.NewRecorder();s.handleCompanySync(rr,req);if rr.Code!=http.StatusOK{t.Fatalf("%d %s",rr.Code,rr.Body.String())}};call(false);if companySyncEnabled(s.store.Settings(),"VIPUL TEXTILES"){t.Fatal("remove failed")};call(true);if !companySyncEnabled(s.store.Settings(),"vipul textiles"){t.Fatal("restore failed")}}\n''',encoding='utf-8')

          p=Path('android/app/build.gradle');s=p.read_text(encoding='utf-8')
          if 'versionCode 20500' not in s: raise SystemExit('android version anchor missing')
          p.write_text(s.replace('versionCode 20500','versionCode 20501',1).replace("versionName '2.5.0'","versionName '2.5.1'",1),encoding='utf-8')
          Path('android/app/src/main/java/in/tallybridge/app/AppSession.java').write_text('''package in.tallybridge.app;\nfinal class AppSession {private static volatile boolean unlocked=false;private AppSession(){}static boolean isUnlocked(){return unlocked;}static void unlock(){unlocked=true;}static void lock(){unlocked=false;}}\n''',encoding='utf-8')
          Path('android/app/src/test/java/in/tallybridge/app/AppSessionTest.java').write_text('''package in.tallybridge.app;import org.junit.Test;import static org.junit.Assert.*;public class AppSessionTest{@Test public void sharedUnlockState(){AppSession.lock();assertFalse(AppSession.isUnlocked());AppSession.unlock();assertTrue(AppSession.isUnlocked());AppSession.lock();assertFalse(AppSession.isUnlocked());}}\n''',encoding='utf-8')
          p=Path('android/app/src/main/java/in/tallybridge/app/MainActivity.java');s=p.read_text(encoding='utf-8')
          old='private boolean unlocked=false,visible=false,authenticating=false,loginRunning=false,destroyed=false,pollBusy=false;'
          if old not in s: raise SystemExit('MainActivity unlock field missing')
          s=s.replace(old,'private boolean unlocked=AppSession.isUnlocked(),visible=false,authenticating=false,loginRunning=false,destroyed=false,pollBusy=false;',1)
          old='@Override protected void onResume(){super.onResume();visible=true;if(store==null)return;'
          if old not in s: raise SystemExit('MainActivity onResume missing')
          s=s.replace(old,'@Override protected void onResume(){super.onResume();visible=true;if(AppSession.isUnlocked())unlocked=true;if(store==null)return;',1)
          if s.count('unlocked=true;begin();')<2: raise SystemExit('auth success anchors missing')
          s=s.replace('unlocked=true;begin();','unlocked=true;AppSession.unlock();begin();')
          if 'store.reset();cache.clear();' not in s: raise SystemExit('reset anchor missing')
          s=s.replace('store.reset();cache.clear();','store.reset();AppSession.lock();unlocked=false;cache.clear();',1)
          start=s.index('  gap(page,16);TextView moneyTitle=');end=s.index('  JSONObject update=object(boot,"update");',start)
          home='''  gap(page,16);TextView workTitle=text("QUICK ACTIONS",11,MUTED);workTitle.setTypeface(null,Typeface.BOLD);workTitle.setLetterSpacing(.10f);page.addView(workTitle);gap(page,8);\n  quick(page,"search","Search everything","Customers, invoices, orders, items and LR/RR numbers",()->startActivity(new Intent(this,UniversalSearchActivity.class)));\n  quick(page,"Reports","New order","Create an order quickly • works offline",()->{Intent i=new Intent(this,OrdersActivity.class);i.setAction(OrdersActivity.ACTION_QUICK);startActivity(i);});\n  quick(page,"health","Today's work","Pending orders, dispatch, business status and items needing attention",()->startActivity(new Intent(this,WorkActivity.class)));\n  quick(page,"calculator","GSM calculator","Calculate towel GSM from size and weight • offline",()->startActivity(new Intent(this,GsmCalculatorActivity.class)));\n  quick(page,"Proforma","Proforma invoice","Create and share a proforma invoice",()->rootTab("Proforma"));\n  gap(page,10);TextView moneyTitle=text("MONEY OVERVIEW",11,MUTED);moneyTitle.setTypeface(null,Typeface.BOLD);moneyTitle.setLetterSpacing(.10f);page.addView(moneyTitle);gap(page,8);\n  metric(page,"Receivable",amountOrMissing(sm,"receivable"),time(sm.optString("rFetchedAt")),"receive",true,()->open(()->outstanding("receivable")));\n  metric(page,"Payable",amountOrMissing(sm,"payable"),time(sm.optString("pFetchedAt")),"pay",false,()->open(()->outstanding("payable")));\n  metric(page,"Sales this month",amountOrMissing(sm,"sales"),time(sm.optString("sFetchedAt")),"Reports",false,()->open(()->register("sales")));\n  gap(page,8);TextView reportTitle=text("REPORTS & MORE",11,MUTED);reportTitle.setTypeface(null,Typeface.BOLD);reportTitle.setLetterSpacing(.10f);page.addView(reportTitle);gap(page,8);\n  quick(page,"Reports","Sales register","Month-wise invoices with verified totals",()->open(()->register("sales")));\n  quick(page,"share","Today's dispatch","Open and share today's invoices",()->open(this::dispatch));\n  quick(page,"health","Company health",healthLine,()->open(this::healthScreen));\n'''
          s=s[:start]+home+s[end:];p.write_text(s,encoding='utf-8')

          Path('android/app/src/main/java/in/tallybridge/app/QuickDockWidget.java').write_text('''package in.tallybridge.app;import android.app.PendingIntent;import android.appwidget.*;import android.content.*;import android.widget.RemoteViews;public final class QuickDockWidget extends AppWidgetProvider{private static PendingIntent p(Context c,int r,Intent i){return PendingIntent.getActivity(c,r,i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);}@Override public void onUpdate(Context c,AppWidgetManager m,int[] ids){for(int id:ids){RemoteViews v=new RemoteViews(c.getPackageName(),R.layout.quick_dock_widget);v.setOnClickPendingIntent(R.id.quick_dock_brand,p(c,7100+id,new Intent(c,MainActivity.class).setAction(MainActivity.ACTION_HOME)));v.setOnClickPendingIntent(R.id.quick_dock_order,p(c,7200+id,new Intent(c,OrdersActivity.class).setAction(OrdersActivity.ACTION_NEW)));v.setOnClickPendingIntent(R.id.quick_dock_gsm,p(c,7300+id,new Intent(c,GsmCalculatorActivity.class)));v.setOnClickPendingIntent(R.id.quick_dock_proforma,p(c,7400+id,new Intent(c,MainActivity.class).setAction(MainActivity.ACTION_NEW_PROFORMA)));m.updateAppWidget(id,v);}}}\n''',encoding='utf-8')
          Path('android/app/src/main/res/layout/quick_dock_widget.xml').write_text('''<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal" android:baselineAligned="false" android:weightSum="5" android:padding="5dp" android:background="@drawable/quick_dock_bg"><LinearLayout android:id="@+id/quick_dock_brand" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="2" android:gravity="center_vertical" android:orientation="horizontal" android:paddingLeft="12dp" android:paddingRight="10dp" android:background="@drawable/quick_dock_brand"><ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/app_icon" android:contentDescription="TallyBridge"/><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginLeft="9dp" android:text="TallyBridge" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="17sp" android:maxLines="1" android:ellipsize="end"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="›" android:textColor="#9BDCCA" android:textStyle="bold" android:textSize="28sp"/></LinearLayout><LinearLayout android:id="@+id/quick_dock_order" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_marginLeft="5dp" android:gravity="center" android:orientation="vertical" android:background="@drawable/quick_dock_order"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="+" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="25sp" android:includeFontPadding="false"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Add Order" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp" android:maxLines="1"/></LinearLayout><LinearLayout android:id="@+id/quick_dock_gsm" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_marginLeft="5dp" android:gravity="center" android:orientation="vertical" android:background="@drawable/quick_dock_gsm"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="GSM" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="16sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Calculator" android:textColor="#D7E7EA" android:textStyle="bold" android:textSize="9sp"/></LinearLayout><LinearLayout android:id="@+id/quick_dock_proforma" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_marginLeft="5dp" android:gravity="center" android:orientation="vertical" android:background="@drawable/quick_dock_proforma"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="₹" android:textColor="#9BDCCA" android:textStyle="bold" android:textSize="20sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Proforma" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp"/></LinearLayout></LinearLayout>\n''',encoding='utf-8')
          d=Path('android/app/src/main/res/drawable')
          shapes={'quick_dock_bg.xml':'<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#0D2233"/><corners android:radius="19dp"/><stroke android:width="1dp" android:color="#345A6B"/></shape>','quick_dock_brand.xml':'<shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:angle="0" android:startColor="#164464" android:endColor="#102D44"/><corners android:radius="15dp"/><stroke android:width="1dp" android:color="#2D627A"/></shape>','quick_dock_order.xml':'<shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:angle="0" android:startColor="#20806C" android:endColor="#176B5B"/><corners android:radius="15dp"/><stroke android:width="1dp" android:color="#4A9B88"/></shape>','quick_dock_gsm.xml':'<shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:angle="0" android:startColor="#1E6070" android:endColor="#174B5D"/><corners android:radius="15dp"/><stroke android:width="1dp" android:color="#3A7B89"/></shape>','quick_dock_proforma.xml':'<shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:angle="0" android:startColor="#28556B" android:endColor="#193B50"/><corners android:radius="15dp"/><stroke android:width="1dp" android:color="#477387"/></shape>'}
          for n,v in shapes.items():(d/n).write_text(v+'\n',encoding='utf-8')
          Path('android/app/src/main/res/xml/quick_dock_widget_info.xml').write_text('''<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="300dp" android:minHeight="70dp" android:minResizeWidth="250dp" android:minResizeHeight="70dp" android:targetCellWidth="5" android:targetCellHeight="1" android:updatePeriodMillis="0" android:initialLayout="@layout/quick_dock_widget" android:resizeMode="horizontal" android:widgetCategory="home_screen"/>\n''',encoding='utf-8')
          p=Path('android/app/src/main/AndroidManifest.xml');s=p.read_text(encoding='utf-8');mark='        <receiver android:name=".ProformaWidget" android:exported="false">\n';rec='        <receiver android:name=".QuickDockWidget" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/quick_dock_widget_info" /></receiver>\n'
          if mark not in s: raise SystemExit('manifest widget anchor missing')
          p.write_text(s.replace(mark,rec+mark,1),encoding='utf-8')
          p=Path('android/app/src/androidTest/java/in/tallybridge/app/OrdersOfflineTest.java');s=p.read_text(encoding='utf-8');mark='  ui(()->{OrdersActivity a=rule.getActivity();FrameLayout stage=new FrameLayout(a);stage.setBackgroundColor(Color.rgb(232,237,242));View widget=a.getLayoutInflater().inflate(R.layout.voice_order_widget,stage,false);int size=Math.round(104*a.getResources().getDisplayMetrics().density);stage.addView(widget,new FrameLayout.LayoutParams(size,size,Gravity.CENTER));a.setContentView(stage);});capture("35-widget-voice-order-1x1");\n';extra=mark+'  ui(()->{OrdersActivity a=rule.getActivity();FrameLayout stage=new FrameLayout(a);stage.setBackgroundColor(Color.rgb(232,237,242));View widget=a.getLayoutInflater().inflate(R.layout.quick_dock_widget,stage,false);int w=Math.round(390*a.getResources().getDisplayMetrics().density),h=Math.round(92*a.getResources().getDisplayMetrics().density);stage.addView(widget,new FrameLayout.LayoutParams(w,h,Gravity.CENTER));a.setContentView(stage);});capture("36-widget-quick-dock-5x1");\n'
          if mark not in s: raise SystemExit('visual test anchor missing')
          p.write_text(s.replace(mark,extra,1),encoding='utf-8')
          PY
          gofmt -w internal/app/types.go internal/app/store.go internal/app/autosync.go internal/app/server.go internal/app/sync_company_test.go
          go test ./internal/app
          cd android
          gradle --no-daemon test assembleDebug lintDebug
      - name: Commit backend and Android final changes
        run: |
          git config user.name "Vipul Shegur"
          git config user.email "vsshegur@gmail.com"
          git add internal/app android/app
          git commit -m "Finalize 2.5.1 backend and Android"
          git push origin final-2.5.1
