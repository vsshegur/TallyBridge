name: Apply TallyBridge 2.5.1 final polish
on:
  push:
    branches: [final-2.5.1]
    paths: ['.github/workflows/apply-final-v251.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-2.5.1
      - name: Apply final source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Version + persistent sync exclusions.
          p=Path('internal/app/types.go'); s=p.read_text(encoding='utf-8')
          s=s.replace('const Version = "2.5.0"','const Version = "2.5.1"',1)
          old='\tAutoUpdate  bool   `json:"autoUpdate"`\n}'
          new='\tAutoUpdate  bool   `json:"autoUpdate"`\n\tSyncExcludedCompanies []string `json:"syncExcludedCompanies,omitempty"`\n}'
          if old not in s: raise SystemExit('Settings anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace('internal/app/store.go',
          '''\t\t\tif json.Unmarshal(b, &raw) == nil {\n\t\t\t\tif _, ok := raw["autoUpdate"]; ok {\n\t\t\t\t\ts.settings.AutoUpdate = x.AutoUpdate\n\t\t\t\t}\n\t\t\t}\n\t\t}\n''',
          '''\t\t\tif json.Unmarshal(b, &raw) == nil {\n\t\t\t\tif _, ok := raw["autoUpdate"]; ok {\n\t\t\t\t\ts.settings.AutoUpdate = x.AutoUpdate\n\t\t\t\t}\n\t\t\t}\n\t\t\ts.settings.SyncExcludedCompanies = append([]string(nil), x.SyncExcludedCompanies...)\n\t\t}\n''','store exclusions')

          # Auto-sync respects desktop exclusions, case-insensitively.
          p=Path('internal/app/autosync.go'); s=p.read_text(encoding='utf-8')
          anchor='func (s *Server) setAuto(fn func(*AutoSyncState)) { s.mu.Lock(); fn(&s.auto); s.mu.Unlock() }\n'
          helper='''func (s *Server) setAuto(fn func(*AutoSyncState)) { s.mu.Lock(); fn(&s.auto); s.mu.Unlock() }\nfunc companySyncEnabled(cfg Settings, name string) bool {\n\ttarget := strings.TrimSpace(name)\n\tif target == "" { return false }\n\tfor _, x := range cfg.SyncExcludedCompanies {\n\t\tif strings.EqualFold(strings.TrimSpace(x), target) { return false }\n\t}\n\treturn true\n}\nfunc filterSyncCompanies(companies []Company, cfg Settings) []Company {\n\tout := make([]Company, 0, len(companies))\n\tseen := map[string]bool{}\n\tfor _, c := range companies {\n\t\tname := strings.TrimSpace(c.Name)\n\t\tkey := strings.ToLower(name)\n\t\tif name == "" || seen[key] || !companySyncEnabled(cfg, name) { continue }\n\t\tc.Name = name; out = append(out, c); seen[key] = true\n\t}\n\treturn out\n}\nfunc (s *Server) syncCompanyEnabled(name string) bool { return companySyncEnabled(s.store.Settings(), name) }\n'''
          if anchor not in s: raise SystemExit('autosync helper anchor missing')
          s=s.replace(anchor,helper,1)
          s=s.replace('func (s *Server) startAutoSync(company, reason string) bool {\n\ts.mu.Lock()', 'func (s *Server) startAutoSync(company, reason string) bool {\n\tcompany = strings.TrimSpace(company)\n\tif company != "" && !s.syncCompanyEnabled(company) { return false }\n\ts.mu.Lock()',1)
          s=s.replace('\tcompanies := []string{}\n', '\tcompanies := []string{}\n\tdiscovered := 0\n',1)
          old='''\t\tfor _, c := range st.Companies {\n\t\t\tif c.Name != "" {\n\t\t\t\tcompanies = append(companies, c.Name)\n\t\t\t}\n\t\t}\n'''
          new='''\t\tfor _, c := range st.Companies {\n\t\t\tif strings.TrimSpace(c.Name) != "" {\n\t\t\t\tdiscovered++\n\t\t\t\tif s.syncCompanyEnabled(c.Name) { companies = append(companies, strings.TrimSpace(c.Name)) }\n\t\t\t}\n\t\t}\n'''
          if old not in s: raise SystemExit('autosync company loop missing')
          s=s.replace(old,new,1)
          old='''\tif len(companies) == 0 {\n\t\ts.setAuto(func(a *AutoSyncState) {\n\t\t\ta.LastError = "No open Tally company detected yet"\n'''
          new='''\tif len(companies) == 0 {\n\t\ts.setAuto(func(a *AutoSyncState) {\n\t\t\tif discovered > 0 { a.LastError = "No companies are enabled for automatic sync" } else { a.LastError = "No open Tally company detected yet" }\n'''
          if old not in s: raise SystemExit('autosync empty message missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Server endpoint + mobile filtering.
          p=Path('internal/app/server.go'); s=p.read_text(encoding='utf-8')
          old='\tm.HandleFunc("/api/v1/admin/settings", s.localAdmin(s.handleSettings))\n'
          new=old+'\tm.HandleFunc("/api/v1/admin/company-sync", s.localAdmin(s.handleCompanySync))\n'
          if old not in s: raise SystemExit('server route anchor missing')
          s=s.replace(old,new,1)
          marker='func (s *Server) handleAdminSync(w http.ResponseWriter, r *http.Request) {'
          handler='''func (s *Server) handleCompanySync(w http.ResponseWriter, r *http.Request) {\n\tif r.Method != http.MethodPost { jsonErr(w, 405, errors.New("POST required")); return }\n\tvar q struct { Company string `json:"company"`; Enabled bool `json:"enabled"` }\n\tif readJSON(r, &q) != nil { jsonErr(w, 400, errors.New("invalid company sync request")); return }\n\tname := strings.TrimSpace(q.Company)\n\tif name == "" { jsonErr(w, 400, errors.New("company is required")); return }\n\tcfg := s.store.Settings()\n\tnext := make([]string, 0, len(cfg.SyncExcludedCompanies)+1)\n\tfor _, x := range cfg.SyncExcludedCompanies {\n\t\tx = strings.TrimSpace(x)\n\t\tif x != "" && !strings.EqualFold(x, name) { next = append(next, x) }\n\t}\n\tif !q.Enabled { next = append(next, name) }\n\tsort.Slice(next, func(i,j int) bool { return strings.ToLower(next[i]) < strings.ToLower(next[j]) })\n\tcfg.SyncExcludedCompanies = next\n\tif e := s.store.UpdateSettings(cfg); e != nil { jsonErr(w, 500, e); return }\n\tjsonOut(w, map[string]any{"ok": true, "company": name, "enabled": q.Enabled, "syncExcludedCompanies": next})\n}\n'''
          if marker not in s: raise SystemExit('handleAdminSync marker missing')
          s=s.replace(marker,handler+marker,1)
          old='''func (s *Server) handleAdminSync(w http.ResponseWriter, r *http.Request) {\n\tvar q struct {\n\t\tCompany string `json:"company"`\n\t}\n\t_ = readJSON(r, &q)\n\tstarted := s.startAutoSync(q.Company, "desktop")\n'''
          new='''func (s *Server) handleAdminSync(w http.ResponseWriter, r *http.Request) {\n\tvar q struct {\n\t\tCompany string `json:"company"`\n\t}\n\t_ = readJSON(r, &q)\n\tif strings.TrimSpace(q.Company) != "" && !s.syncCompanyEnabled(q.Company) { jsonErr(w, 409, errors.New("company is excluded from sync; add it back in Companies")); return }\n\tstarted := s.startAutoSync(q.Company, "desktop")\n'''
          if old not in s: raise SystemExit('admin sync anchor missing')
          s=s.replace(old,new,1)
          old='''func (s *Server) bootstrapPayload() map[string]any {\n\tst := s.stateSnapshot()\n\tcc, _ := s.cache.Companies()\n\tcs := st.Companies\n\tif len(cs) == 0 {\n\t\tcs = cc\n\t}\n'''
          new='''func (s *Server) bootstrapPayload() map[string]any {\n\tst := s.stateSnapshot()\n\tcc, _ := s.cache.Companies()\n\tcfg := s.store.Settings()\n\tcs := filterSyncCompanies(st.Companies, cfg)\n\tif len(cs) == 0 {\n\t\tcs = filterSyncCompanies(cc, cfg)\n\t}\n'''
          if old not in s: raise SystemExit('bootstrap anchor missing')
          s=s.replace(old,new,1)
          # Remove later duplicate cfg declaration.
          s=s.replace('\tconfig := s.store.Settings()\n', '\tconfig := s.store.Settings()\n',1) if False else s
          # Exact existing declaration later in bootstrap.
          boot_start=s.index('func (s *Server) bootstrapPayload()')
          boot_end=s.index('func (s *Server) handleBootstrap',boot_start)
          segment=s[boot_start:boot_end]
          target='\tcfg := s.store.Settings()\n\tif cfg.AutoUpdate {'
          if segment.count(target)!=1: raise SystemExit(f'bootstrap cfg duplicate anchor count {segment.count(target)}')
          segment=segment.replace(target,'\tif cfg.AutoUpdate {',1)
          s=s[:boot_start]+segment+s[boot_end:]
          old='''func (s *Server) handleMobileSync(w http.ResponseWriter, r *http.Request) {\n\tvar q struct {\n\t\tCompany string `json:"company"`\n\t\tReason  string `json:"reason"`\n\t}\n\t_ = readJSON(r, &q)\n\tstarted := s.startAutoSync(q.Company, q.Reason)\n'''
          new='''func (s *Server) handleMobileSync(w http.ResponseWriter, r *http.Request) {\n\tvar q struct {\n\t\tCompany string `json:"company"`\n\t\tReason  string `json:"reason"`\n\t}\n\t_ = readJSON(r, &q)\n\tif strings.TrimSpace(q.Company) != "" && !s.syncCompanyEnabled(q.Company) { jsonErr(w, 409, errors.New("company is excluded from sync on the Windows app")); return }\n\tstarted := s.startAutoSync(q.Company, q.Reason)\n'''
          if old not in s: raise SystemExit('mobile sync anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Desktop Companies UI with reversible remove/add sync controls.
          p=Path('internal/app/web/admin.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('v2.4.6 • dark control center • read-only Tally access','FINAL • read-only Tally access',1)
          s=s.replace("if(route==='companies')return JSON.stringify([route,!!l.tallyOnline,(l.companies||[]).map(x=>[x.id,x.name]),cc.map(x=>[x.id,x.name]),l.lastError,a.running]);","if(route==='companies')return JSON.stringify([route,!!l.tallyOnline,(l.companies||[]).map(x=>[x.id,x.name]),cc.map(x=>[x.id,x.name]),l.lastError,a.running,d.settings?.syncExcludedCompanies||[]]);",1)
          s=s.replace("if(route==='live')return JSON.stringify([route,a.running,a.company,a.step,a.lastOk,a.lastError,c.entries,c.latestAt,cc.map(x=>x.name)]);","if(route==='live')return JSON.stringify([route,a.running,a.company,a.step,a.lastOk,a.lastError,c.entries,c.latestAt,cc.map(x=>x.name),d.settings?.syncExcludedCompanies||[]]);",1)
          start=s.index('function renderCompanies(){')
          end=s.index('function renderDevices(){',start)
          companies_fn='''function renderCompanies(){\n const live=snap.live?.companies||[],saved=snap.cachedCompanies||[],excludedNames=snap.settings?.syncExcludedCompanies||[],excluded=new Set(excludedNames.map(n=>String(n).trim().toLowerCase()).filter(Boolean)),seen=new Set(),rows=[];\n const add=(x,m)=>{const name=String(x?.name||'').trim(),key=name.toLowerCase();if(!name||seen.has(key))return;seen.add(key);rows.push([{...x,name},m,excluded.has(key)])};\n live.forEach(x=>add(x,'LIVE'));saved.forEach(x=>add(x,'SAVED'));excludedNames.forEach(name=>add({name},'SAVED'));\n $('#page').innerHTML=head('Companies','Choose exactly which Tally companies should sync to the phone. Removing a company here never deletes or changes it inside TallyPrime.')+`${rows.length?`<div class="card">${rows.map(([x,m,off])=>`<div class="list-row"><div><div class="title">${esc(x.name)}</div><div class="sub">${off?'Excluded from automatic sync and the Android company list':m==='LIVE'?'Currently verified from TallyPrime • automatic sync enabled':'Available from saved company list • automatic sync enabled'}</div></div><div class="toolbar" style="margin:0"><span class="status-pill ${off?'warn':m==='LIVE'?'ok':'warn'}">${off?'NOT SYNCING':m}</span><button class="btn ${off?'secondary':'danger'}" data-action="company-sync" data-name="${esc(x.name)}" data-enabled="${off?'1':'0'}">${off?'Add to Sync':'Remove from Sync'}</button></div></div>`).join('')}</div>`:'<div class="empty">No company known yet. Open a company in TallyPrime; automatic sync will discover it.</div>'}`}\n'''
          s=s[:start]+companies_fn+s[end:]
          start=s.index('function renderLive(){')
          end=s.index('let healthCompany',start)
          live_fn='''function renderLive(){const live=snap.live?.companies||[],saved=snap.cachedCompanies||[],excludedNames=snap.settings?.syncExcludedCompanies||[],excluded=new Set(excludedNames.map(n=>String(n).trim().toLowerCase())),names=[...new Set([...live,...saved].map(x=>x.name).filter(Boolean))].filter(n=>!excluded.has(String(n).trim().toLowerCase())),a=snap.autoSync||{},c=snap.cache||{};$('#page').innerHTML=head('Automatic Sync','Only companies enabled in Companies are refreshed and sent to Android.')+`<div class="grid"><div class="card span6"><div class="metric-label">Status</div><div class="metric-value">${a.running?'SYNCING':'AUTO SYNC ON'}</div><div class="metric-sub">${a.running?esc((a.company||'All enabled companies')+' • '+(a.step||'Starting')):(a.lastOk&&!String(a.lastOk).startsWith('0001')?'Last complete '+fmtAgo(a.lastOk):'Waiting for first complete sync')}</div></div><div class="card span6"><div class="metric-label">Latest saved data</div><div class="metric-value" style="font-size:18px">${c.latestAt&&!String(c.latestAt).startsWith('0001')?fmtAgo(c.latestAt):'Not yet'}</div><div class="metric-sub">PC-local last-known-good copy</div></div></div>${a.lastError?`<div class="notice warn" style="margin-top:14px"><b>Last automatic attempt stopped safely:</b> ${esc(a.lastError)}<br>TallyBridge will retry automatically. Existing saved data is untouched.</div>`:`<div class="notice ok" style="margin-top:14px"><b>No action required.</b> Automatic sync runs after startup and every 3 minutes.</div>`}${excludedNames.length?`<div class="notice info" style="margin-top:12px"><b>${excludedNames.length} compan${excludedNames.length===1?'y is':'ies are'} excluded from sync.</b> Open Companies to add them back.</div>`:''}${names.length?`<div class="section-title">Companies being synced</div><div class="card">${names.map(n=>`<div class="list-row"><div><div class="title">${esc(n)}</div><div class="sub">Ledger index → Receivable → Sales this month → Payable</div></div><span class="status-pill ok">AUTO</span></div>`).join('')}</div>`:'<div class="empty" style="margin-top:14px">No company is currently enabled for automatic sync. Open Companies to add one back.</div>'}<div class="toolbar" style="margin-top:14px"><button class="btn secondary" data-action="sync-now">Sync now (optional)</button></div><div class="notice info" style="margin-top:12px">The worker always uses one Tally request at a time and stops immediately on the first timeout or error.</div>`}\n'''
          s=s[:start]+live_fn+s[end:]
          needle="}else if(a==='save-settings'){"
          insert="""}else if(a==='company-sync'){const enabled=b.dataset.enabled==='1',name=b.dataset.name||'';if(!name)throw new Error('Company name missing');if(!enabled&&!confirm(`Remove ${name} from automatic sync?\\n\\nIt will disappear from the Android company list, but nothing will be deleted from TallyPrime.`))return;await api('/api/v1/admin/company-sync',{method:'POST',body:JSON.stringify({company:name,enabled})});toast(enabled?`${name} added back to sync`:`${name} removed from sync`);await loadSnapshot(true)}else if(a==='save-settings'){"""
          if needle not in s: raise SystemExit('admin company-sync click anchor missing')
          s=s.replace(needle,insert,1)
          p.write_text(s,encoding='utf-8')

          # Android 2.5.1 update-friendly version.
          p=Path('android/app/build.gradle'); s=p.read_text(encoding='utf-8')
          s=s.replace('versionCode 20500','versionCode 20501',1).replace("versionName '2.5.0'","versionName '2.5.1'",1)
          p.write_text(s,encoding='utf-8')

          # One unlock per running app session, shared across MainActivity instances.
          Path('android/app/src/main/java/in/tallybridge/app/AppSession.java').write_text('''package in.tallybridge.app;\n\n/** In-memory lock state shared by activities. Process death starts a fresh locked session. */\nfinal class AppSession {\n private static volatile boolean unlocked=false;\n private AppSession(){}\n static boolean isUnlocked(){return unlocked;}\n static void unlock(){unlocked=true;}\n static void lock(){unlocked=false;}\n}\n''',encoding='utf-8')
          Path('android/app/src/test/java/in/tallybridge/app/AppSessionTest.java').write_text('''package in.tallybridge.app;\n\nimport org.junit.Test;\nimport static org.junit.Assert.*;\n\npublic class AppSessionTest {\n @Test public void unlockStateIsSharedUntilExplicitLock(){\n  AppSession.lock();assertFalse(AppSession.isUnlocked());\n  AppSession.unlock();assertTrue(AppSession.isUnlocked());\n  AppSession.lock();assertFalse(AppSession.isUnlocked());\n }\n}\n''',encoding='utf-8')
          p=Path('android/app/src/main/java/in/tallybridge/app/MainActivity.java'); s=p.read_text(encoding='utf-8')
          s=s.replace('private boolean unlocked=false,visible=false,authenticating=false,loginRunning=false,destroyed=false,pollBusy=false;','private boolean unlocked=AppSession.isUnlocked(),visible=false,authenticating=false,loginRunning=false,destroyed=false,pollBusy=false;',1)
          old='@Override protected void onResume(){super.onResume();visible=true;if(store==null)return;'
          new='@Override protected void onResume(){super.onResume();visible=true;if(AppSession.isUnlocked())unlocked=true;if(store==null)return;'
          if old not in s: raise SystemExit('onResume unlock anchor missing')
          s=s.replace(old,new,1)
          if s.count('unlocked=true;begin();')<2: raise SystemExit('auth success anchors missing')
          s=s.replace('unlocked=true;begin();','unlocked=true;AppSession.unlock();begin();')
          s=s.replace('store.reset();cache.clear();','store.reset();AppSession.lock();unlocked=false;cache.clear();',1)
          # Reorganize Home: daily actions first, then money, then reports.
          start=s.index('  gap(page,16);TextView moneyTitle=')
          end=s.index('  JSONObject update=object(boot,"update");',start)
          home='''  gap(page,16);TextView workTitle=text("QUICK ACTIONS",11,MUTED);workTitle.setTypeface(null,Typeface.BOLD);workTitle.setLetterSpacing(.10f);page.addView(workTitle);gap(page,8);\n  quick(page,"search","Search everything","Customers, invoices, orders, items and LR/RR numbers",()->startActivity(new Intent(this,UniversalSearchActivity.class)));\n  quick(page,"Reports","New order","Create an order quickly • works offline",()->{Intent i=new Intent(this,OrdersActivity.class);i.setAction(OrdersActivity.ACTION_QUICK);startActivity(i);});\n  quick(page,"health","Today's work","Pending orders, dispatch, business status and items needing attention",()->startActivity(new Intent(this,WorkActivity.class)));\n  quick(page,"calculator","GSM calculator","Calculate towel GSM from size and weight • offline",()->startActivity(new Intent(this,GsmCalculatorActivity.class)));\n  quick(page,"Proforma","Proforma invoice","Create and share a proforma invoice",()->rootTab("Proforma"));\n  gap(page,10);TextView moneyTitle=text("MONEY OVERVIEW",11,MUTED);moneyTitle.setTypeface(null,Typeface.BOLD);moneyTitle.setLetterSpacing(.10f);page.addView(moneyTitle);gap(page,8);\n  metric(page,"Receivable",amountOrMissing(sm,"receivable"),time(sm.optString("rFetchedAt")),"receive",true,()->open(()->outstanding("receivable")));\n  metric(page,"Payable",amountOrMissing(sm,"payable"),time(sm.optString("pFetchedAt")),"pay",false,()->open(()->outstanding("payable")));\n  metric(page,"Sales this month",amountOrMissing(sm,"sales"),time(sm.optString("sFetchedAt")),"Reports",false,()->open(()->register("sales")));\n  gap(page,8);TextView reportTitle=text("REPORTS & MORE",11,MUTED);reportTitle.setTypeface(null,Typeface.BOLD);reportTitle.setLetterSpacing(.10f);page.addView(reportTitle);gap(page,8);\n  quick(page,"Reports","Sales register","Month-wise invoices with verified totals",()->open(()->register("sales")));\n  quick(page,"share","Today's dispatch","Open and share today's invoices",()->open(this::dispatch));\n  quick(page,"health","Company health",healthLine,()->open(this::healthScreen));\n'''
          s=s[:start]+home+s[end:]
          p.write_text(s,encoding='utf-8')

          # Final 5x1 all-around widget, using the app's actual navy/teal palette.
          Path('android/app/src/main/java/in/tallybridge/app/QuickDockWidget.java').write_text('''package in.tallybridge.app;\n\nimport android.app.PendingIntent;\nimport android.appwidget.AppWidgetManager;\nimport android.appwidget.AppWidgetProvider;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.widget.RemoteViews;\n\n/** 5x1 all-around dock: open TallyBridge, add order, GSM and proforma. */\npublic final class QuickDockWidget extends AppWidgetProvider {\n private static PendingIntent open(Context c,int req,Intent i){return PendingIntent.getActivity(c,req,i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);}\n @Override public void onUpdate(Context c,AppWidgetManager m,int[] ids){\n  for(int id:ids){RemoteViews v=new RemoteViews(c.getPackageName(),R.layout.quick_dock_widget);\n   v.setOnClickPendingIntent(R.id.quick_dock_brand,open(c,7100+id,new Intent(c,MainActivity.class).setAction(MainActivity.ACTION_HOME)));\n   v.setOnClickPendingIntent(R.id.quick_dock_order,open(c,7200+id,new Intent(c,OrdersActivity.class).setAction(OrdersActivity.ACTION_NEW)));\n   v.setOnClickPendingIntent(R.id.quick_dock_gsm,open(c,7300+id,new Intent(c,GsmCalculatorActivity.class)));\n   v.setOnClickPendingIntent(R.id.quick_dock_proforma,open(c,7400+id,new Intent(c,MainActivity.class).setAction(MainActivity.ACTION_NEW_PROFORMA)));\n   m.updateAppWidget(id,v);\n  }\n }\n}\n''',encoding='utf-8')

          Path('android/app/src/main/res/layout/quick_dock_widget.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    android:layout_width="match_parent" android:layout_height="match_parent"\n    android:orientation="horizontal" android:baselineAligned="false" android:weightSum="5"\n    android:padding="5dp" android:background="@drawable/quick_dock_bg">\n    <LinearLayout android:id="@+id/quick_dock_brand" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="2" android:gravity="center_vertical" android:orientation="horizontal" android:paddingLeft="12dp" android:paddingRight="10dp" android:background="@drawable/quick_dock_brand">\n        <ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/app_icon" android:contentDescription="TallyBridge" />\n        <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginLeft="9dp" android:text="TallyBridge" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="17sp" android:maxLines="1" android:ellipsize="end" />\n        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="›" android:textColor="#9BDCCA" android:textStyle="bold" android:textSize="28sp" />\n    </LinearLayout>\n    <LinearLayout android:id="@+id/quick_dock_order" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_marginLeft="5dp" android:gravity="center" android:orientation="vertical" android:background="@drawable/quick_dock_order">\n        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="+" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="25sp" android:includeFontPadding="false" />\n        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Add Order" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp" android:maxLines="1" />\n    </LinearLayout>\n    <LinearLayout android:id="@+id/quick_dock_gsm" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_marginLeft="5dp" android:gravity="center" android:orientation="vertical" android:background="@drawable/quick_dock_gsm">\n        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="GSM" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="16sp" android:includeFontPadding="false" />\n        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Calculator" android:textColor="#D7E7EA" android:textStyle="bold" android:textSize="9sp" android:maxLines="1" />\n    </LinearLayout>\n    <LinearLayout android:id="@+id/quick_dock_proforma" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_marginLeft="5dp" android:gravity="center" android:orientation="vertical" android:background="@drawable/quick_dock_proforma">\n        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="₹" android:textColor="#9BDCCA" android:textStyle="bold" android:textSize="20sp" android:includeFontPadding="false" />\n        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Proforma" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp" android:maxLines="1" />\n    </LinearLayout>\n</LinearLayout>\n''',encoding='utf-8')
