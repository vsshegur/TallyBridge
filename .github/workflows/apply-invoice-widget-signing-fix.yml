          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "Wrong Android SHA-256: $ACTUAL_SHA256"; exit 1; }
'''
          release = release.replace(build_marker, verify_step + build_marker, 1)
          verify_anchor = '          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt\n'
          if release.count(verify_anchor) != 1:
              raise SystemExit('release APK verification anchor not found')
          apk_verify = verify_anchor + r'''          EXPECTED_APK_SHA1=$(sed -n 's/^SHA-1: //p' PERMANENT_SIGNING_IDENTITY.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_APK_SHA256=$(sed -n 's/^SHA-256: //p' PERMANENT_SIGNING_IDENTITY.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL_APK_SHA1=$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt | head -1 | tr '[:upper:]' '[:lower:]')
          ACTUAL_APK_SHA256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt | head -1 | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_APK_SHA1" = "$EXPECTED_APK_SHA1" || { echo "Final APK SHA-1 signer mismatch"; exit 1; }
          test "$ACTUAL_APK_SHA256" = "$EXPECTED_APK_SHA256" || { echo "Final APK SHA-256 signer mismatch"; exit 1; }
'''
          release = release.replace(verify_anchor, apk_verify, 1)
          write(release_path, release)

          # Main CI still uses debug for emulator tests, but only publishes an
          # installable Android artifact when the permanent keystore is present.
          build_path = '.github/workflows/build.yml'
          build = read(build_path)
          android_start = build.index('  android:\n')
          open_expr = '$' + '{{'
          android_job = r'''  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: __OPEN__ secrets.ANDROID_KEYSTORE_BASE64 __CLOSE__
      TB_STORE_PASSWORD: __OPEN__ secrets.ANDROID_KEYSTORE_PASSWORD __CLOSE__
      TB_KEY_ALIAS: __OPEN__ secrets.ANDROID_KEY_ALIAS __CLOSE__
      TB_KEY_PASSWORD: __OPEN__ secrets.ANDROID_KEY_PASSWORD __CLOSE__
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint native Android test build
        working-directory: android
        run: |
          gradle --no-daemon test assembleDebug lintDebug
          gradle --no-daemon signingReport > app/build/outputs/apk/debug/SIGNING-REPORT.txt
      - name: Verify packaged APK version
        working-directory: android
        run: |
          EXPECTED_CODE=$(sed -nE "s/.*versionCode ([0-9]+).*/\1/p" app/build.gradle | head -1)
          EXPECTED_NAME=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/APK-VERSION.txt
          grep -q "versionCode='$EXPECTED_CODE'" app/build/outputs/apk/debug/APK-VERSION.txt
          grep -q "versionName='$EXPECTED_NAME'" app/build/outputs/apk/debug/APK-VERSION.txt
      - name: Restore permanent release keystore
        if: __OPEN__ env.ANDROID_KEYSTORE_BASE64 != '' && env.TB_STORE_PASSWORD != '' && env.TB_KEY_ALIAS != '' && env.TB_KEY_PASSWORD != '' __CLOSE__
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tallybridge-release.jks"
          chmod 600 "$RUNNER_TEMP/tallybridge-release.jks"
          echo "TB_KEYSTORE=$RUNNER_TEMP/tallybridge-release.jks" >> "$GITHUB_ENV"
          echo "TB_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
      - name: Build and verify permanent-signed Android release
        if: env.TB_SIGNED_RELEASE == 'true'
        working-directory: android
        shell: bash
        run: |
          EXPECTED_SHA1=$(sed -n 's/^SHA-1: //p' PERMANENT_SIGNING_IDENTITY.txt | tr -d '\r')
          EXPECTED_SHA256=$(sed -n 's/^SHA-256: //p' PERMANENT_SIGNING_IDENTITY.txt | tr -d '\r')
          KEYTOOL_OUT=$(keytool -list -v -keystore "$TB_KEYSTORE" -storepass "$TB_STORE_PASSWORD" -alias "$TB_KEY_ALIAS")
          ACTUAL_SHA1=$(printf '%s\n' "$KEYTOOL_OUT" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1 | tr -d '\r')
          ACTUAL_SHA256=$(printf '%s\n' "$KEYTOOL_OUT" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d '\r')
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1" || { echo "Permanent SHA-1 mismatch"; exit 1; }
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "Permanent SHA-256 mismatch"; exit 1; }
          gradle --no-daemon assembleRelease lintRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt
          EXPECTED_APK_SHA1=$(echo "$EXPECTED_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_APK_SHA256=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL_APK_SHA1=$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt | head -1 | tr '[:upper:]' '[:lower:]')
          ACTUAL_APK_SHA256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt | head -1 | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_APK_SHA1" = "$EXPECTED_APK_SHA1"
          test "$ACTUAL_APK_SHA256" = "$EXPECTED_APK_SHA256"
          sha256sum "$APK" > app/build/outputs/apk/release/TallyBridge-Android-SHA256SUMS.txt
          printf 'SHA-1: %s\nSHA-256: %s\n' "$ACTUAL_SHA1" "$ACTUAL_SHA256" > app/build/outputs/apk/release/TallyBridge-Android-SIGNING-IDENTITY.txt
      - name: Signing secrets not configured
        if: __OPEN__ env.ANDROID_KEYSTORE_BASE64 == '' || env.TB_STORE_PASSWORD == '' || env.TB_KEY_ALIAS == '' || env.TB_KEY_PASSWORD == '' __CLOSE__
        run: echo "::warning::Permanent Android signing secrets are not configured; no installable APK artifact will be published from this run."
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-Test-Build-Do-Not-Install
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SIGNING-REPORT.txt
            android/app/build/outputs/apk/debug/APK-VERSION.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.TB_SIGNED_RELEASE == 'true'
        with:
          name: TallyBridge-Android-Permanent-Signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/TallyBridge-Android-SHA256SUMS.txt
            android/app/build/outputs/apk/release/TallyBridge-Android-SIGNING-IDENTITY.txt
            android/app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Lint-Report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Build visual checks
        working-directory: android
        run: gradle --no-daemon assembleDebugAndroidTest
      - name: Check native layouts on Android emulator
        timeout-minutes: 12
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tallybridge-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat /tmp/emulator.log || true' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n design -k "system-images;android-30;google_apis;x86_64" --force
          test -f "$ANDROID_AVD_HOME/design.ini"
          "$ANDROID_HOME/emulator/emulator" -avd design -skin 1080x1920 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot > /tmp/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/design-results.txt
          grep -q 'OK (10 tests)' /tmp/design-results.txt
          mkdir -p android/ui-screenshots
          for screen in 01-unlock 02-overview 03-reports 04-connect 05-dark-overview 06-dark-reports 07-dark-connect 08-dark-appearance 09-outstanding 10-filters 11-sync 12-proforma 13-proforma-totals 14-proforma-review 15-payments 16-health 17-diagnostics 18-more 19-orders-offline 20-orders-details-only 21-orders-widget 22-photo-order-share 23-orders-dark 24-orders-dispatched-dark 25-orders-widget-dark 26-work-today 27-customer-360 28-work-system; do
            adb exec-out run-as in.tallybridge.app cat "files/ui/$screen.png" > "android/ui-screenshots/$screen.png"
            test -s "android/ui-screenshots/$screen.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Design-Screenshots
          path: android/ui-screenshots/*.png
          if-no-files-found: ignore
'''
          android_job = android_job.replace('__OPEN__', open_expr).replace('__CLOSE__', '}}')
          build = build[:android_start] + android_job
          write(build_path, build)
          PY

          gofmt -w internal/app/tally.go internal/app/tally_test.go internal/app/pdf.go internal/app/types.go
          git diff --check

      - name: Verify backend and parser/PDF tests
        run: |
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall

      - name: Verify Android compile and lint
        working-directory: android
        run: gradle --no-daemon test assembleDebug lintDebug

      - name: Guard requested behavior
        shell: bash
        run: |
          ! grep -q 'Read-only copy of data returned by TallyPrime' internal/app/pdf.go
          grep -q 'HSN: inventoryHSN(n)' internal/app/tally.go
          grep -q 'customerAddressLines(r)' internal/app/tally.go
          grep -q 'onStop(){super.onStop();visible=false;}' android/app/src/main/java/in/tallybridge/app/MainActivity.java
          grep -q 'android:minResizeHeight="150dp"' android/app/src/main/res/xml/orders_widget_info.xml
          grep -q 'versionName '\''2.4.1'\''' android/app/build.gradle
          grep -q 'const Version = "2.4.1"' internal/app/types.go

      - name: Commit verified repair
        shell: bash
        run: |
          git rm .github/workflows/apply-invoice-widget-signing-fix.yml
          git config user.name 'TallyBridge Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix invoice HSN/address, app resume, widget and permanent signing'
          git push origin HEAD:fix/invoice-widget-signing-20261003
