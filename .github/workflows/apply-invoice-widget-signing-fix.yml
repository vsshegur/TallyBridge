name: Apply invoice, lifecycle, widget and signing fixes

on:
  push:
    branches:
      - fix/invoice-widget-signing-20261003
    paths:
      - .github/workflows/apply-invoice-widget-signing-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def one(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          one("internal/app/types.go", 'const Version = "2.4.0"', 'const Version = "2.4.1"')
          one("android/app/build.gradle", "versionCode 20400", "versionCode 20401")
          one("android/app/build.gradle", "versionName '2.4.0'", "versionName '2.4.1'")

          one(
              "android/app/build.gradle",
              "def releaseSigningEnabled = System.getenv('TB_KEYSTORE') != null && !System.getenv('TB_KEYSTORE').isEmpty()\n",
              "def releaseSigningEnabled = System.getenv('TB_KEYSTORE') != null && !System.getenv('TB_KEYSTORE').isEmpty()\n"
              "def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }\n"
              "if (System.getenv('CI') == 'true' && releaseTaskRequested && !releaseSigningEnabled) {\n"
              "    throw new GradleException('CI release builds require the permanent TallyBridge signing keystore')\n"
              "}\n",
          )

          p = "internal/app/tally.go"
          s = read(p)
          marker = "func parseVoucherDetail(b []byte, company, masterID string, hint VoucherRow) VoucherDetail {"
          if s.count(marker) != 1:
              raise SystemExit("parseVoucherDetail marker not found exactly once")
          helpers = r'''func cleanInvoiceAddressLines(lines []string) []string {
          	out := make([]string, 0, len(lines))
          	seen := map[string]bool{}
          	for _, line := range lines {
          		line = strings.TrimSpace(line)
          		if line == "" {
          			continue
          		}
          		key := strings.ToLower(strings.Join(strings.Fields(line), " "))
          		if !seen[key] {
          			seen[key] = true
          			out = append(out, line)
          		}
          	}
          	return out
          }

          func customerAddressLines(r *xnode) []string {
          	if r == nil {
          		return nil
          	}
          	lines := []string{}
          	for _, tag := range []string{"BASICBUYERADDRESS", "BUYERADDRESS", "CONSIGNEEADDRESS"} {
          		lines = append(lines, allDeep(r, tag)...)
          	}
          	lines = cleanInvoiceAddressLines(lines)
          	if len(lines) == 0 {
          		lines = cleanInvoiceAddressLines(allDeep(r, "ADDRESS"))
          	}
          	return lines
          }

          func normalizeHSNValue(value string) string {
          	value = strings.TrimSpace(stripTags(value))
          	if value == "" {
          		return ""
          	}
          	upper := strings.ToUpper(value)
          	if upper == "NA" || upper == "N/A" || strings.Contains(upper, "NOT APPLICABLE") {
          		return ""
          	}
          	var digits strings.Builder
          	for i := 0; i < len(value); i++ {
          		if value[i] >= '0' && value[i] <= '9' {
          			digits.WriteByte(value[i])
          		}
          	}
          	code := digits.String()
          	if len(code) >= 2 && len(code) <= 8 {
          		return code
          	}
          	return ""
          }

          func inventoryHSN(n *xnode) string {
          	if n == nil {
          		return ""
          	}
          	tags := []string{"GSTOVRDNHSNCODE", "GSTHSNCODE", "HSNCODE", "HSNSAC", "HSN", "SACCODE", "GSTHSNNAME"}
          	for _, tag := range tags {
          		if code := normalizeHSNValue(directChild(n, tag)); code != "" {
          			return code
          		}
          	}
          	for _, tag := range tags {
          		if code := normalizeHSNValue(firstDeep(n, tag)); code != "" {
          			return code
          		}
          	}
          	raw := firstDeepTagMatch(n, func(tag string) bool {
          		u := strings.ToUpper(tag)
          		if !strings.Contains(u, "HSN") && !strings.Contains(u, "SAC") {
          			return false
          		}
          		if strings.Contains(u, "APPLICABLE") || strings.Contains(u, "SOURCE") || strings.Contains(u, "DATE") || strings.Contains(u, "RATE") {
          			return false
          		}
          		return strings.Contains(u, "CODE") || strings.HasSuffix(u, "HSN") || strings.HasSuffix(u, "SAC")
          	})
          	return normalizeHSNValue(raw)
          }

          '''
          s = s.replace(marker, helpers + marker, 1)
          old = 'x.CustomerAddress = allDeep(r, "ADDRESS")'
          if s.count(old) != 1:
              raise SystemExit("customer address assignment marker mismatch")
          s = s.replace(old, 'x.CustomerAddress = customerAddressLines(r)', 1)
          old = 'HSN: firstDeep(n, "HSN", "HSNCODE", "HSNSAC")'
          if s.count(old) != 1:
              raise SystemExit("HSN marker mismatch")
          s = s.replace(old, 'HSN: inventoryHSN(n)', 1)
          write(p, s)

          p = "internal/app/tally_test.go"
          s = read(p)
          if "TestVoucherDetailReadsBuyerAddressAndGSTHSNOverrides" not in s:
              s += r'''

          func TestVoucherDetailReadsBuyerAddressAndGSTHSNOverrides(t *testing.T) {
          	xmlb := []byte(`<VOUCHER><MASTERID>44</MASTERID><VOUCHERNUMBER>INV-44</VOUCHERNUMBER><DATE>20261003</DATE><BASICBUYERNAME>ABC Stores</BASICBUYERNAME><BASICBUYERCITY>Solapur</BASICBUYERCITY><BASICBUYERADDRESS.LIST><BASICBUYERADDRESS>12 Market Road</BASICBUYERADDRESS><BASICBUYERADDRESS>Solapur 413001</BASICBUYERADDRESS></BASICBUYERADDRESS.LIST><ALLINVENTORYENTRIES.LIST><STOCKITEMNAME>Bath Towel</STOCKITEMNAME><GSTOVRDNHSNCODE>63026090</GSTOVRDNHSNCODE><BILLEDQTY>2 pcs</BILLEDQTY><RATE>250.00/pcs</RATE><AMOUNT>-500.00</AMOUNT></ALLINVENTORYENTRIES.LIST><ALLLEDGERENTRIES.LIST><LEDGERNAME>ABC Stores</LEDGERNAME><AMOUNT>-500.00</AMOUNT></ALLLEDGERENTRIES.LIST></VOUCHER>`)
          	x := parseVoucherDetail(xmlb, "VIPUL TEXTILES", "44", VoucherRow{MasterID: "44", Party: "ABC Stores", Amount: 500})
          	if len(x.Items) != 1 || x.Items[0].HSN != "63026090" {
          		t.Fatalf("HSN override not recovered: %+v", x.Items)
          	}
          	if got := strings.Join(x.CustomerAddress, " | "); !strings.Contains(got, "12 Market Road") || !strings.Contains(got, "Solapur 413001") {
          		t.Fatalf("buyer address not recovered: %#v", x.CustomerAddress)
          	}
          	pdf := invoiceHTML(x)
          	if strings.Contains(pdf, "Read-only copy of data returned by TallyPrime") {
          		t.Fatal("customer invoice must not contain old internal subtitle")
          	}
          	for _, want := range []string{"BILL TO", "12 Market Road", "Solapur 413001", "63026090", "INV-44"} {
          		if !strings.Contains(pdf, want) {
          			t.Fatalf("revamped invoice missing %q", want)
          		}
          	}
          }

          func TestVoucherDetailReadsNestedGSTHSNCode(t *testing.T) {
          	xmlb := []byte(`<VOUCHER><ALLINVENTORYENTRIES.LIST><STOCKITEMNAME>Napkin</STOCKITEMNAME><GSTDETAILS.LIST><GSTHSNCODE>63071090</GSTHSNCODE><RATEOFGST>18</RATEOFGST></GSTDETAILS.LIST><BILLEDQTY>1 pcs</BILLEDQTY><RATE>100.00/pcs</RATE><AMOUNT>-100.00</AMOUNT></ALLINVENTORYENTRIES.LIST></VOUCHER>`)
          	x := parseVoucherDetail(xmlb, "Firm", "1", VoucherRow{})
          	if len(x.Items) != 1 || x.Items[0].HSN != "63071090" {
          		t.Fatalf("nested GST HSN not recovered correctly: %+v", x.Items)
          	}
          }
          '''
          write(p, s)

          p = "internal/app/pdf.go"
          s = read(p)
          css_old = '.narration{margin-top:4mm;white-space:pre-wrap}.meta{margin-bottom:4mm;font-size:8pt;color:#65758a}'
          css_new = css_old + r'''
           .invoice-summary{display:table;width:100%;table-layout:fixed;margin:1mm 0 4mm}.invoice-card{display:table-cell;vertical-align:top;padding:3.5mm;border:1pt solid #d9e3ec;background:#f8fafc}.invoice-card+.invoice-card{border-left:4mm solid white}.invoice-label{font-size:7.5pt;letter-spacing:.9pt;font-weight:bold;color:#60758b;margin-bottom:1.4mm}.party-name{font-size:12pt;font-weight:bold;color:#132c49;margin-bottom:1mm}.party-address{font-size:8.4pt;color:#40536b;line-height:1.5}.party-address div{margin:.3mm 0}.invoice-number{font-size:15pt;font-weight:bold;color:#173f62;margin:0 0 2mm}.gst-line{margin-top:1.5mm;font-size:8.2pt;font-weight:bold;color:#29455f}.dispatch-card{margin:0 0 4mm;padding:3mm 3.5mm;border:1pt solid #d9e3ec;background:#fff}.dispatch-card h3{margin-bottom:1mm}.dispatch-card .kv td{padding:.7mm 0}.items td:nth-child(3),.items th:nth-child(3){text-align:center}.document-card .kv td:first-child{width:42%}'''
          if s.count(css_old) != 1:
              raise SystemExit("invoice CSS anchor mismatch")
          s = s.replace(css_old, css_new, 1)
          adaptive_old = '.narration{margin-top:2mm!important}`'
          adaptive_new = '.narration{margin-top:2mm!important}.invoice-card{padding:2.3mm!important}.invoice-summary{margin-bottom:2.6mm!important}.dispatch-card{padding:2mm 2.4mm!important;margin-bottom:2.5mm!important}.invoice-number{font-size:13pt!important}`'
          if s.count(adaptive_old) != 1:
              raise SystemExit("adaptive CSS anchor mismatch")
          s = s.replace(adaptive_old, adaptive_new, 1)

          start = s.index("func invoiceHTML(x VoucherDetail, bank ...BankDetails) string {")
          end = s.index("\nfunc invoicePDF(", start)
          new_invoice = r'''func invoiceHTML(x VoucherDetail, bank ...BankDetails) string {
          	var b strings.Builder
          	address := append([]string(nil), x.CustomerAddress...)
          	if x.CustomerCity != "" {
          		address = append(address, x.CustomerCity)
          	}
          	address = cleanInvoiceAddressLines(address)

          	b.WriteString(`<div class="invoice-summary"><section class="invoice-card"><div class="invoice-label">BILL TO</div>`)
          	fmt.Fprintf(&b, `<div class="party-name">%s</div>`, he(firstNonBlank(x.CustomerName, "Customer")))
          	if len(address) == 0 {
          		b.WriteString(`<div class="party-address muted">Address not returned by Tally</div>`)
          	} else {
          		b.WriteString(`<div class="party-address">`)
          		for _, line := range address {
          			fmt.Fprintf(&b, `<div>%s</div>`, he(line))
          		}
          		b.WriteString(`</div>`)
          	}
          	if x.GSTIN != "" {
          		fmt.Fprintf(&b, `<div class="gst-line">GSTIN %s</div>`, he(x.GSTIN))
          	}
          	b.WriteString(`</section><section class="invoice-card document-card"><div class="invoice-label">INVOICE DETAILS</div>`)
          	fmt.Fprintf(&b, `<div class="invoice-number">%s</div><table class="kv">`, he(dash(x.InvoiceNumber)))
          	for _, r := range [][2]string{{"Invoice date", displayDate(x.InvoiceDate)}, {"Voucher type", x.VoucherType}} {
          		if r[1] != "" && r[1] != "-" {
          			fmt.Fprintf(&b, `<tr><td>%s</td><td><b>%s</b></td></tr>`, he(r[0]), he(r[1]))
          		}
          	}
          	b.WriteString(`</table></section></div>`)

          	dispatch := [][2]string{{"Dispatched through", x.DispatchedThrough}, {"LR / RR number", x.LRNumber}, {"LR / RR date", displayDate(x.LRDate)}, {"Destination", x.Destination}, {"Vehicle number", x.VehicleNumber}, {"e-Way bill", x.EWayBillNumber}}
          	hasDispatch := false
          	for _, r := range dispatch {
          		if r[1] != "" && r[1] != "-" {
          			hasDispatch = true
          			break
          		}
          	}
          	if hasDispatch {
          		b.WriteString(`<section class="dispatch-card"><h3>Dispatch details</h3><table class="kv">`)
          		for _, r := range dispatch {
          			if r[1] != "" && r[1] != "-" {
          				fmt.Fprintf(&b, `<tr><td>%s</td><td>%s</td></tr>`, he(r[0]), he(r[1]))
          			}
          		}
          		b.WriteString(`</table></section>`)
          	}

          	b.WriteString(`<table class="items"><colgroup><col style="width:5%"><col style="width:33%"><col style="width:11%"><col style="width:14%"><col style="width:16%"><col style="width:21%"></colgroup><thead><tr><th>#</th><th>Product</th><th>HSN</th><th class="num">Quantity</th><th class="num">Rate</th><th class="num">Amount (INR)</th></tr></thead><tbody>`)
          	for i, it := range x.Items {
          		fmt.Fprintf(&b, `<tr><td>%d</td><td>%s</td><td>%s</td><td class="num">%s</td><td class="num">%s</td><td class="num">%s</td></tr>`, i+1, he(it.Name)+descriptionHTML(it.Description), he(dash(it.HSN)), he(it.Quantity), he(it.Rate), he(indianNumber(it.Amount)))
          	}
          	if len(x.Items) == 0 {
          		b.WriteString(`<tr><td colspan="6">No product rows returned by Tally.</td></tr>`)
          	}
          	b.WriteString(`</tbody></table><table class="totals">`)
          	if len(x.Items) > 0 {
          		subtotal := 0.0
          		for _, item := range x.Items {
          			subtotal += item.Amount
          		}
          		fmt.Fprintf(&b, `<tr><td>Items subtotal</td><td>%s</td></tr>`, he(inr(subtotal)))
          	}
          	for _, r := range []struct {
          		label string
          		value float64
          	}{{"Invoice discount", -x.DiscountAmount}, {"Taxable amount", x.TaxableAmount}, {"CGST", x.CGST}, {"SGST", x.SGST}, {"IGST", x.IGST}, {"Freight / charges", x.Freight}, {"Round off", x.RoundOff}, {"Other adjustments", x.OtherCharges}} {
          		if r.value != 0 {
          			fmt.Fprintf(&b, `<tr><td>%s</td><td>%s</td></tr>`, he(r.label), he(inr(r.value)))
          		}
          	}
          	fmt.Fprintf(&b, `<tr class="grand"><td>Total amount</td><td>%s</td></tr></table>`, he(inr(x.TotalAmount)))
          	b.WriteString(bankHTML(bank, PaymentQR{Amount: x.TotalAmount, Reference: "Invoice " + x.InvoiceNumber, Payee: firstNonBlank(x.Supplier.Name, x.FirmName, x.Company)}))
          	if x.Narration != "" {
          		fmt.Fprintf(&b, `<div class="narration"><h3>Narration</h3>%s</div>`, he(x.Narration))
          	}
          	title := "INVOICE"
          	if x.Optional {
          		title = "PROFORMA INVOICE"
          	}
          	return adaptiveInvoiceHTML(pdfDocument(firstNonBlank(x.FirmName, x.Company), title, "", b.String(), x.Supplier), len(x.Items))
          }'''
          s = s[:start] + new_invoice + s[end:]
          write(p, s)

          p = "android/app/src/main/java/in/tallybridge/app/MainActivity.java"
          s = read(p)
          old_stop = '@Override protected void onStop(){super.onStop();visible=false;if(!authenticating){unlocked=false;generation++;cache.clear();cacheAt.clear();} }'
          if s.count(old_stop) != 1:
              raise SystemExit("MainActivity onStop marker mismatch")
          s = s.replace(old_stop, '@Override protected void onStop(){super.onStop();visible=false;}', 1)
          old_buyer = 'data.add(row(x.optString("customerName"),x.optString("customerCity")+"\\n"+join(array(x,"customerAddress"))+"\\n"+x.optString("gstin"),"",null));'
          new_buyer = 'String buyerAddress=join(array(x,"customerAddress")).trim();String buyerCity=x.optString("customerCity").trim();if(!buyerCity.isEmpty()&&!buyerAddress.toLowerCase(Locale.ROOT).contains(buyerCity.toLowerCase(Locale.ROOT)))buyerAddress+=(buyerAddress.isEmpty()?"":"\\n")+buyerCity;String buyerGST=x.optString("gstin").trim();if(!buyerGST.isEmpty())buyerAddress+=(buyerAddress.isEmpty()?"":"\\n")+"GSTIN "+buyerGST;data.add(heading("Bill to • "+x.optString("customerName","Customer"),buyerAddress.isEmpty()?"Address not returned by Tally":buyerAddress));'
          if s.count(old_buyer) != 1:
              raise SystemExit("MainActivity invoice buyer marker mismatch")
          s = s.replace(old_buyer, new_buyer, 1)
          write(p, s)

          one(
              "android/app/src/main/AndroidManifest.xml",
              'android:configChanges="orientation|screenSize|keyboardHidden"\n            android:windowSoftInputMode="adjustResize">',
              'android:configChanges="orientation|screenSize|keyboardHidden"\n            android:alwaysRetainTaskState="true" android:launchMode="singleTop"\n            android:windowSoftInputMode="adjustResize">',
          )

          p = "android/app/src/main/java/in/tallybridge/app/OrdersWidget.java"
          s = read(p)
          start = s.index(" private static void paintCached(Context c,AppWidgetManager m,int id){")
          end = s.index("\n private static void cache(", start)
          paint = r''' private static void paintCached(Context c,AppWidgetManager m,int id){
            android.content.SharedPreferences p=c.getSharedPreferences(PREFS,Context.MODE_PRIVATE);
            RemoteViews v=new RemoteViews(c.getPackageName(),previewLayout(c));
            int count=p.getInt("pending",0);String names=p.getString("names","");boolean offline=p.getBoolean("offline",false);
            Bundle options=m.getAppWidgetOptions(id);int height=options==null?0:options.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT,0);boolean compact=height>0&&height<175;
            v.setTextViewText(R.id.widget_pending,count+" pending order"+(count==1?"":"s"));
            v.setTextViewText(R.id.widget_mode,offline?"OFFLINE • PHONE COPY":"SYNCED WITH PC");
            v.setTextViewText(R.id.widget_names,names.isEmpty()?(count==0?"No pending orders. Add one when a customer calls.":"Tap Open pending to review orders."):names);
            v.setViewVisibility(R.id.widget_mode,compact?android.view.View.GONE:android.view.View.VISIBLE);
            v.setViewVisibility(R.id.widget_names,compact?android.view.View.GONE:android.view.View.VISIBLE);
            v.setOnClickPendingIntent(R.id.widget_add,activity(c,OrdersActivity.ACTION_NEW,31));
            v.setOnClickPendingIntent(R.id.widget_open,activity(c,null,32));
            v.setOnClickPendingIntent(R.id.widget_refresh,refresh(c));
            v.setOnClickPendingIntent(R.id.widget_names,activity(c,null,34));
            v.setOnClickPendingIntent(R.id.widget_pending,activity(c,null,35));
            m.updateAppWidget(id,v);
           }
          '''
          s = s[:start] + paint + s[end:]
          write(p, s)

          for p in ["android/app/src/main/res/layout/orders_widget.xml", "android/app/src/main/res/layout/orders_widget_dark.xml"]:
              s = read(p)
              s = s.replace('android:textSize="9sp" android:textStyle="bold" android:letterSpacing="0.12"', 'android:textSize="10sp" android:textStyle="bold" android:letterSpacing="0.12"', 1)
              s = s.replace('android:textSize="17sp" android:textStyle="bold"', 'android:textSize="18sp" android:textStyle="bold"', 1)
              s = s.replace('android:textSize="20sp" android:textStyle="bold"', 'android:textSize="21sp" android:textStyle="bold"', 1)
              s = s.replace('android:textSize="9sp" android:textStyle="bold" />', 'android:textSize="10sp" android:textStyle="bold" />', 1)
              s = s.replace('android:id="@+id/widget_names" android:layout_width="match_parent" android:layout_height="wrap_content"', 'android:id="@+id/widget_names" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:minHeight="26dp"', 1)
              s = s.replace('android:layout_marginTop="4dp" android:maxLines="1" android:ellipsize="end"', 'android:layout_marginTop="4dp" android:maxLines="3" android:ellipsize="end" android:gravity="center_vertical"', 1)
              s = s.replace('android:textSize="12sp" />', 'android:textSize="13sp" />', 1)
              s = s.replace('android:layout_height="42dp"', 'android:layout_height="46dp"')
              s = s.replace('android:textSize="12sp" android:textStyle="bold"', 'android:textSize="13sp" android:textStyle="bold"')
              write(p, s)

          one("android/app/src/main/res/xml/orders_widget_info.xml", 'android:minHeight="120dp"', 'android:minHeight="170dp"')
          one("android/app/src/main/res/xml/orders_widget_info.xml", 'android:minResizeWidth="180dp"', 'android:minResizeWidth="220dp"')
          one("android/app/src/main/res/xml/orders_widget_info.xml", 'android:minResizeHeight="100dp"', 'android:minResizeHeight="150dp"')

          p = ".github/workflows/release.yml"
          s = read(p)
          anchor = "      - name: Test and build signed Android release\n"
          if s.count(anchor) != 1:
              raise SystemExit("release build anchor mismatch")
          verify = r'''      - name: Verify permanent Android keystore identity
                  working-directory: android
                  shell: bash
                  run: |
                    EXPECTED_SHA1=$(sed -n 's/^SHA-1: //p' PERMANENT_SIGNING_IDENTITY.txt | tr -d '\r')
                    EXPECTED_SHA256=$(sed -n 's/^SHA-256: //p' PERMANENT_SIGNING_IDENTITY.txt | tr -d '\r')
                    KEYTOOL_OUT=$(keytool -list -v -keystore "$TB_KEYSTORE" -storepass "$TB_STORE_PASSWORD" -alias "$TB_KEY_ALIAS")
                    ACTUAL_SHA1=$(printf '%s\n' "$KEYTOOL_OUT" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1 | tr -d '\r')
                    ACTUAL_SHA256=$(printf '%s\n' "$KEYTOOL_OUT" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d '\r')
                    test "$ACTUAL_SHA1" = "$EXPECTED_SHA1" || { echo "Wrong Android SHA-1: $ACTUAL_SHA1"; exit 1; }
                    test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "Wrong Android SHA-256: $ACTUAL_SHA256"; exit 1; }
          '''
          s = s.replace(anchor, verify + anchor, 1)
          apk_anchor = '          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt\n'
          if s.count(apk_anchor) != 1:
              raise SystemExit("APK signer anchor mismatch")
          apk_verify = apk_anchor + r'''          EXPECTED_APK_SHA1=$(sed -n 's/^SHA-1: //p' PERMANENT_SIGNING_IDENTITY.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
                    EXPECTED_APK_SHA256=$(sed -n 's/^SHA-256: //p' PERMANENT_SIGNING_IDENTITY.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
                    ACTUAL_APK_SHA1=$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt | head -1 | tr '[:upper:]' '[:lower:]')
                    ACTUAL_APK_SHA256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt | head -1 | tr '[:upper:]' '[:lower:]')
                    test "$ACTUAL_APK_SHA1" = "$EXPECTED_APK_SHA1" || { echo "Final APK SHA-1 signer mismatch"; exit 1; }
                    test "$ACTUAL_APK_SHA256" = "$EXPECTED_APK_SHA256" || { echo "Final APK SHA-256 signer mismatch"; exit 1; }
          '''
          s = s.replace(apk_anchor, apk_verify, 1)
          write(p, s)

          p = ".github/workflows/build.yml"
          s = read(p)
          old = '''      - name: Build and lint native Android
                  working-directory: android
                  run: |
                    gradle --no-daemon assembleDebug assembleRelease lintDebug
                    gradle --no-daemon signingReport > app/build/outputs/apk/debug/SIGNING-REPORT.txt
                    test -s app/build/outputs/apk/release/app-release-unsigned.apk
          '''
          new = '''      - name: Build and lint native Android test build
                  working-directory: android
                  run: |
                    gradle --no-daemon test assembleDebug lintDebug
                    gradle --no-daemon signingReport > app/build/outputs/apk/debug/SIGNING-REPORT.txt
          '''
          if s.count(old) != 1:
              raise SystemExit("build.yml Android build block mismatch")
          s = s.replace(old, new, 1)
          s = s.replace('name: TallyBridge-Android-Preview', 'name: Android-Debug-Test-Build-Do-Not-Install', 1)
          unsigned = '''      - uses: actions/upload-artifact@v4
                  with:
                    name: TallyBridge-Android-Unsigned-Release
                    path: android/app/build/outputs/apk/release/app-release-unsigned.apk
                    if-no-files-found: error
          '''
          if s.count(unsigned) != 1:
              raise SystemExit("unsigned release artifact block mismatch")
          s = s.replace(unsigned, "", 1)
          write(p, s)
          PY
          gofmt -w internal/app/tally.go internal/app/tally_test.go internal/app/pdf.go internal/app/types.go
          git diff --check

      - name: Verify backend and parser/PDF tests
        run: |
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall

      - name: Verify Android compile and lint
        working-directory: android
        run: gradle --no-daemon test assembleDebug lintDebug

      - name: Guard requested behavior
        shell: bash
        run: |
          ! grep -q 'Read-only copy of data returned by TallyPrime' internal/app/pdf.go
          grep -q 'HSN: inventoryHSN(n)' internal/app/tally.go
          grep -q 'customerAddressLines(r)' internal/app/tally.go
          grep -q 'onStop(){super.onStop();visible=false;}' android/app/src/main/java/in/tallybridge/app/MainActivity.java
          grep -q 'android:minResizeHeight="150dp"' android/app/src/main/res/xml/orders_widget_info.xml
          grep -q "versionName '2.4.1'" android/app/build.gradle
          grep -q 'const Version = "2.4.1"' internal/app/types.go

      - name: Commit verified repair
        shell: bash
        run: |
          git rm .github/workflows/apply-invoice-widget-signing-fix.yml
          git config user.name 'TallyBridge Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix invoice HSN/address, app resume, widget and permanent signing'
          git push origin HEAD:fix/invoice-widget-signing-20261003
