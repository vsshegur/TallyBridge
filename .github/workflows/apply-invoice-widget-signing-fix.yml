name: Apply invoice, lifecycle, widget and signing fixes

on:
  push:
    branches:
      - fix/invoice-widget-signing-20261003
    paths:
      - .github/workflows/apply-invoice-widget-signing-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:90]!r}')
              write(path, text.replace(old, new, 1))

          # Version the repair so Android update/install logic sees it as newer.
          replace_once('internal/app/types.go', 'const Version = "2.4.0"', 'const Version = "2.4.1"')
          replace_once('android/app/build.gradle', 'versionCode 20400', 'versionCode 20401')
          replace_once('android/app/build.gradle', "versionName '2.4.0'", "versionName '2.4.1'")
          replace_once(
              'android/app/build.gradle',
              "def releaseSigningEnabled = System.getenv('TB_KEYSTORE') != null && !System.getenv('TB_KEYSTORE').isEmpty()\n",
              "def releaseSigningEnabled = System.getenv('TB_KEYSTORE') != null && !System.getenv('TB_KEYSTORE').isEmpty()\n"
              "def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }\n"
              "if (System.getenv('CI') == 'true' && releaseTaskRequested && !releaseSigningEnabled) {\n"
              "    throw new GradleException('CI release builds require the permanent TallyBridge signing keystore')\n"
              "}\n"
          )

          # Tally voucher parser: prefer buyer-specific address fields and robust GST/HSN aliases.
          tally_path = 'internal/app/tally.go'
          tally = read(tally_path)
          marker = 'func parseVoucherDetail(b []byte, company, masterID string, hint VoucherRow) VoucherDetail {'
          if marker not in tally:
              raise SystemExit('parseVoucherDetail marker not found')
          helper = r'''func cleanInvoiceAddressLines(lines []string) []string {
	out := make([]string, 0, len(lines))
	seen := map[string]bool{}
	for _, line := range lines {
		line = strings.TrimSpace(line)
		if line == "" {
			continue
		}
		key := strings.ToLower(strings.Join(strings.Fields(line), " "))
		if !seen[key] {
			seen[key] = true
			out = append(out, line)
		}
	}
	return out
}

func customerAddressLines(r *xnode) []string {
	if r == nil {
		return nil
	}
	lines := []string{}
	for _, tag := range []string{"BASICBUYERADDRESS", "BUYERADDRESS", "CONSIGNEEADDRESS"} {
		lines = append(lines, allDeep(r, tag)...)
	}
	lines = cleanInvoiceAddressLines(lines)
	if len(lines) == 0 {
		// Older Tally exports sometimes expose only generic ADDRESS nodes.
		// Keep this as a final fallback after buyer-specific fields so supplier
		// or unrelated nested addresses cannot win when buyer data is present.
		lines = cleanInvoiceAddressLines(allDeep(r, "ADDRESS"))
	}
	return lines
}

func normalizeHSNValue(value string) string {
	value = strings.TrimSpace(stripTags(value))
	if value == "" {
		return ""
	}
	upper := strings.ToUpper(value)
	if upper == "NA" || upper == "N/A" || strings.Contains(upper, "NOT APPLICABLE") {
		return ""
	}
	var digits strings.Builder
	for i := 0; i < len(value); i++ {
		if value[i] >= '0' && value[i] <= '9' {
			digits.WriteByte(value[i])
		}
	}
	code := digits.String()
	if len(code) >= 2 && len(code) <= 8 {
		return code
	}
	return ""
}

func inventoryHSN(n *xnode) string {
	if n == nil {
		return ""
	}
	// Voucher-level overrides are the most accurate source for the actual
	// invoice line. TallyPrime versions/customisations use several names.
	tags := []string{"GSTOVRDNHSNCODE", "GSTHSNCODE", "HSNCODE", "HSNSAC", "HSN", "SACCODE", "GSTHSNNAME"}
	for _, tag := range tags {
		if code := normalizeHSNValue(directChild(n, tag)); code != "" {
			return code
		}
	}
	for _, tag := range tags {
		if code := normalizeHSNValue(firstDeep(n, tag)); code != "" {
			return code
		}
	}
	// Last-resort support for UDF/custom TDL names. Exclude applicability and
	// source/date fields so a GST date/rate is never mistaken for an HSN code.
	raw := firstDeepTagMatch(n, func(tag string) bool {
		u := strings.ToUpper(tag)
		if !strings.Contains(u, "HSN") && !strings.Contains(u, "SAC") {
			return false
		}
		if strings.Contains(u, "APPLICABLE") || strings.Contains(u, "SOURCE") || strings.Contains(u, "DATE") || strings.Contains(u, "RATE") {
			return false
		}
		return strings.Contains(u, "CODE") || strings.HasSuffix(u, "HSN") || strings.HasSuffix(u, "SAC")
	})
	return normalizeHSNValue(raw)
}

'''
          tally = tally.replace(marker, helper + marker, 1)
          old_addr = 'x.CustomerAddress = allDeep(r, "ADDRESS")'
          if tally.count(old_addr) != 1:
              raise SystemExit('customer address assignment not found exactly once')
