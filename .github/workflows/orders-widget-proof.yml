name: Verify Orders widget proof
on:
  push:
    branches: [feature/orders-widget-proof]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android proof
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Run Orders proof on Android emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tallybridge-orders-widget"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n orderswidget -k "system-images;android-30;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd orderswidget -skin 1080x1920 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -no-metrics > /tmp/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -e class in.tallybridge.app.OrdersOfflineTest in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/orders-results.txt
          grep -q 'OK (1 test)' /tmp/orders-results.txt
          mkdir -p android/orders-proof
          for screen in 19-orders-offline 20-orders-details-only 21-orders-widget; do
            adb exec-out run-as in.tallybridge.app cat "files/ui/$screen.png" > "android/orders-proof/$screen.png"
            test -s "android/orders-proof/$screen.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Orders-Offline-Details-Widget-Screenshots
          path: android/orders-proof/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-2.2.1-Orders-Offline-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
