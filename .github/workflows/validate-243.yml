name: Validate TallyBridge 2.4.3 on Android 15
on:
  push:
    branches: [fix/orders-insets-responsive-widget-20261005]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backend and Windows build
        shell: pwsh
        run: |
          node --check internal/app/web/admin.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test ./internal/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/Build-Windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-Windows-2.4.3-Validation
          path: build/*.exe
          if-no-files-found: error
  android35:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build, lint and create optimized unsigned release
        working-directory: android
        run: |
          gradle --no-daemon test assembleDebug lintDebug assembleDebugAndroidTest
          CI=false gradle --no-daemon assembleRelease
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          find app/build/outputs/apk/release -type f -name '*.apk' -size +0c -print -quit | grep .
      - name: Verify Android 2.4.3 package
        working-directory: android
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/APK-VERSION.txt
          grep -q "name='in.tallybridge.app'" app/build/outputs/apk/debug/APK-VERSION.txt
          grep -q "versionCode='20403'" app/build/outputs/apk/debug/APK-VERSION.txt
          grep -q "versionName='2.4.3'" app/build/outputs/apk/debug/APK-VERSION.txt
      - name: Run full UI suite on Android 15 API 35
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tallybridge-android35"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat /tmp/emulator35.log || true' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n tb35 -k "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd tb35 -skin 1080x1920 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -no-metrics > /tmp/emulator35.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 360 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/android35-results.txt
          grep -q 'OK (10 tests)' /tmp/android35-results.txt
          mkdir -p android/ui-screenshots-api35
          for screen in 19-orders-offline 21-orders-widget 23-orders-dark 25-orders-widget-dark 26-work-today 28-work-system 29-widget-proforma-1x1 30-widget-order-1x1 31-orders-widget-compact 32-orders-widget-compact-dark; do
            adb exec-out run-as in.tallybridge.app cat "files/ui/$screen.png" > "android/ui-screenshots-api35/$screen.png"
            test -s "android/ui-screenshots-api35/$screen.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-15-API35-UI-Proof
          path: android/ui-screenshots-api35/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Android-2.4.3-Optimized-Unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
