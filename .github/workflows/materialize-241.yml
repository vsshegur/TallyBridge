name: Materialize TallyBridge 2.4.1 repair

on:
  push:
    branches: [fix/invoice-widget-signing-20261003]
    paths: [.github/workflows/materialize-241.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/repair_241.py')
          s=p.read_text(encoding='utf-8')
          old='''old_fetch = "Amount,AllInventoryEntries.*,AllLedgerEntries.*,LedgerEntries.*</FETCH>"\nnew_fetch = "Amount,AllInventoryEntries.*,AllInventoryEntries.GSTItemHSNCodeEx,AllLedgerEntries.*,LedgerEntries.*</FETCH>"\nif s.count(old_fetch) != 1:\n    raise SystemExit("voucher detail FETCH anchor mismatch")\ns = s.replace(old_fetch, new_fetch, 1)'''
          new='''old_fetch = "AllInventoryEntries.*"\nnew_fetch = "AllInventoryEntries.*,AllInventoryEntries.GSTItemHSNCodeEx"\nif old_fetch not in s:\n    raise SystemExit("voucher inventory FETCH anchor missing")\ns = s.replace(old_fetch, new_fetch)'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 scripts/repair_241.py
          gofmt -w internal/app/tally.go internal/app/tally_test.go internal/app/pdf.go internal/app/types.go
          git restore .github/workflows/release.yml
          git diff --check
      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name 'TallyBridge Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add internal/app/tally.go internal/app/tally_test.go internal/app/pdf.go internal/app/types.go android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/java/in/tallybridge/app/MainActivity.java android/app/src/main/java/in/tallybridge/app/OrdersWidget.java android/app/src/main/res/layout/orders_widget.xml android/app/src/main/res/layout/orders_widget_dark.xml android/app/src/main/res/xml/orders_widget_info.xml
          git commit -m 'Materialize 2.4.1 invoice widget lifecycle repair'
          git push origin HEAD:fix/invoice-widget-signing-20261003
