name: Diagnose secret names (temporary)
on:
  push:
    branches: [diag/secret-names]
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: List repository secret names (names only, never values)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          NAMES=$(jq -r 'keys | map(select(. != "github_token")) | join(", ")' <<<"$SECRETS_JSON")
          echo "::notice title=Secret names::${NAMES:-none}"
          for n in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "$(jq -r --arg n "$n" '.[$n] // empty' <<<"$SECRETS_JSON")" ]; then echo "::notice title=$n::set"; else echo "::notice title=$n::missing"; fi
          done
