name: Fetch Android signing tool
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fetch-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Download trusted APK signer release
        run: |
          curl --fail --location --retry 3 \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar \
            --output uber-apk-signer-1.3.0.jar
          test -s uber-apk-signer-1.3.0.jar
          sha256sum uber-apk-signer-1.3.0.jar > uber-apk-signer-1.3.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tool
          path: |
            uber-apk-signer-1.3.0.jar
            uber-apk-signer-1.3.0.sha256
          if-no-files-found: error
