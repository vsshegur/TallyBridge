name: Build signed TallyBridge 2.3.0
on:
  push:
    branches: [release/2.3.0-signed-build]
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      TB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      TB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Require permanent Android signing secrets
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$TB_STORE_PASSWORD"
          test -n "$TB_KEY_ALIAS"
          test -n "$TB_KEY_PASSWORD"
      - name: Restore release keystore
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tallybridge-release.jks"
          chmod 600 "$RUNNER_TEMP/tallybridge-release.jks"
          echo "TB_KEYSTORE=$RUNNER_TEMP/tallybridge-release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed Android release
        working-directory: android
        shell: bash
        run: |
          gradle --no-daemon test assembleRelease lintRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt
          sha256sum "$APK" > app/build/outputs/apk/release/TallyBridge-Android-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-2.3.0-Android-Signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/TallyBridge-Android-SHA256SUMS.txt
            android/app/build/outputs/apk/release/TallyBridge-Android-APK-SIGNATURE.txt
          if-no-files-found: error
  windows-release:
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Test backend and prepare signing certificate
        shell: pwsh
        run: |
          go test ./internal/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!$env:WINDOWS_PFX_BASE64 -or !$env:WINDOWS_PFX_PASSWORD) { throw 'Windows signing secrets are missing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'tallybridge-code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $cert = Get-PfxCertificate -FilePath $pfx
          if (!$cert -or $cert.NotAfter -le (Get-Date)) { throw 'Windows signing certificate is missing or expired' }
          "TB_WINDOWS_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TB_WINDOWS_SIGN_PASSWORD=$env:WINDOWS_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build signed Windows installers
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-2.3.0-Windows-Signed
          path: build/*.exe
          if-no-files-found: error
