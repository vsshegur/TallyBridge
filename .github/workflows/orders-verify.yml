name: Verify Orders feature
on:
  push:
    branches: [feature/orders-workflow]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check desktop JavaScript
        run: |
          node --check internal/app/web/admin.js
          node --check internal/app/web/orders.js
      - name: Test backend
        run: |
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint Android Orders
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-Orders-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
