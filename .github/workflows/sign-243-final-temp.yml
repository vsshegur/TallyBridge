name: Build signed final 2.4.3 Android APK
on:
  push:
    branches: [release/2.4.3-final-apk-signed-build-run]
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      TB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      TB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SHA1: '97:43:9E:2E:F7:40:C7:6C:0C:25:CD:AB:0F:AE:B1:B7:B2:83:AA:CE'
      EXPECTED_SHA256: '7F:17:BA:19:5D:05:7C:66:11:DE:AE:88:1D:85:B0:A0:D8:0D:BA:6A:44:EC:7C:21:43:40:05:3D:B4:D1:DB:AB'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Require permanent signing secrets
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          test -n "$TB_STORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD secret is missing'; exit 1; }
          test -n "$TB_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS secret is missing'; exit 1; }
          test -n "$TB_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD secret is missing'; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tallybridge-release.jks"
          chmod 600 "$RUNNER_TEMP/tallybridge-release.jks"
          echo "TB_KEYSTORE=$RUNNER_TEMP/tallybridge-release.jks" >> "$GITHUB_ENV"
      - name: Verify permanent signing identity
        shell: bash
        run: |
          keytool -list -v -keystore "$RUNNER_TEMP/tallybridge-release.jks" -storepass "$TB_STORE_PASSWORD" -alias "$TB_KEY_ALIAS" > "$RUNNER_TEMP/key.txt"
          grep -F "SHA1: $EXPECTED_SHA1" "$RUNNER_TEMP/key.txt"
          grep -F "SHA256: $EXPECTED_SHA256" "$RUNNER_TEMP/key.txt"
      - name: Build minified signed release
        working-directory: android
        shell: bash
        run: |
          gradle --no-daemon test assembleRelease lintRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/SIGNATURE.txt
          "$AAPT" dump badging "$APK" | tee app/build/outputs/apk/release/APK-VERSION.txt
          grep -q "versionCode='20403'" app/build/outputs/apk/release/APK-VERSION.txt
          grep -q "versionName='2.4.3'" app/build/outputs/apk/release/APK-VERSION.txt
          grep -F "Signer #1 certificate SHA-256 digest: ${EXPECTED_SHA256//:/}" app/build/outputs/apk/release/SIGNATURE.txt || true
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256SUMS.txt
          cp "$APK" app/build/outputs/apk/release/TallyBridge-Android-2.4.3-Final-Signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-Android-2.4.3-Final-Signed
          path: |
            android/app/build/outputs/apk/release/TallyBridge-Android-2.4.3-Final-Signed.apk
            android/app/build/outputs/apk/release/APK-VERSION.txt
            android/app/build/outputs/apk/release/SIGNATURE.txt
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
