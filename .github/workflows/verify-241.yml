name: Verify 2.4.1 invoice lifecycle widget signing
on:
  push:
    branches: [feature/invoice-lifecycle-widget-signing-2.4.1]
permissions:
  contents: write
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[verified-241]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply guarded 2.4.1 core patch
        run: |
          python3 scripts/fix_241_guard.py
          python3 scripts/apply_241_core.py
          gofmt -w internal/app/*.go
      - name: Backend desktop and Windows regression
        shell: bash
        run: |
          set +e
          go test ./internal/app > /tmp/backend-241.log 2>&1
          status=$?
          cat /tmp/backend-241.log
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          set -e
          go vet ./internal/app
          node --check internal/app/web/admin.js
          GOOS=windows GOARCH=amd64 go build ./cmd/tallybridge
          GOOS=windows GOARCH=amd64 go build ./cmd/uninstall
      - name: Upload backend diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-2.4.1-Backend-Diagnostic
          path: /tmp/backend-241.log
          if-no-files-found: ignore
      - name: Android build lint and test APK
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug assembleRelease lintDebug assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Full Android 11-test emulator regression
        timeout-minutes: 12
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tallybridge-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat /tmp/emulator.log || true' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n design -k "system-images;android-30;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd design -skin 1080x1920 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot > /tmp/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/241-results.txt
          grep -q 'OK (11 tests)' /tmp/241-results.txt
          mkdir -p android/241-screenshots
          for screen in 29-orders-widget-compact 30-orders-widget-tall; do
            adb exec-out run-as in.tallybridge.app cat "files/ui/$screen.png" > "android/241-screenshots/$screen.png"
            test -s "android/241-screenshots/$screen.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TallyBridge-2.4.1-Widget-Proof
          path: android/241-screenshots/*.png
          if-no-files-found: ignore
      - name: Commit verified source only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- scripts/apply_241_core.py scripts/fix_241_guard.py .github/workflows/verify-241.yml android/241-screenshots || true
          if ! git diff --cached --quiet; then
            git commit -m "[verified-241] Apply invoice lifecycle widget signing hardening"
            git push origin HEAD:feature/invoice-lifecycle-widget-signing-2.4.1
          fi
