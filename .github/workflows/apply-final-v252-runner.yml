name: TallyBridge 2.5.2 Polish Runner
on:
  push:
    branches:
      - final-polish-2.5.2
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-polish-2.5.2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply source polish
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '^Apply TallyBridge 2.5.2 final polish$'; then
            echo 'Source polish already applied.'
            exit 0
          fi
          awk 'BEGIN{f=0} /python3 - <<.PY./{f=1;next} f && /^          PY$/{f=0;exit} f{sub(/^          /,"");print}' .github/workflows/apply-final-v252-polish.yml > /tmp/apply_v252.py
          test -s /tmp/apply_v252.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apply_v252.py')
          s=p.read_text().replace("'voice_order_widget.xml':('◉','Voice Order','Speak & review')", "'voice_order_widget.xml':('◉','Voice Order','Speak &amp; review')")
          p.write_text(s)
          PY
          python3 /tmp/apply_v252.py
          python3 - <<'PY'
          from pathlib import Path
          ids={
            'search_widget.xml':'search_widget_root',
            'voice_order_widget.xml':'voice_widget_root',
            'gsm_widget.xml':'gsm_widget_root',
          }
          for fn,rid in ids.items():
              p=Path('android/app/src/main/res/layout')/fn
              s=p.read_text()
              if f'@+id/{rid}' not in s:
                  s=s.replace('<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"',f'<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/{rid}"',1)
              p.write_text(s)
          PY
          gofmt -w internal/app/group_outstanding.go internal/app/server.go internal/app/native.go internal/app/types.go
      - name: Validate source
        shell: bash
        run: |
          node --check internal/app/web/admin.js
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge
          cd android
          gradle --no-daemon test assembleDebug lintDebug
          cd ..
          grep -q 'versionCode 20502' android/app/build.gradle
          grep -q "versionName '2.5.2'" android/app/build.gradle
          grep -q 'group-outstanding' internal/app/server.go
          grep -q 'registerMonth(kind,month)' android/app/src/main/java/in/tallybridge/app/MainActivity.java
          grep -q 'search_widget_root' android/app/src/main/res/layout/search_widget.xml
          grep -q 'voice_widget_root' android/app/src/main/res/layout/voice_order_widget.xml
          grep -q 'gsm_widget_root' android/app/src/main/res/layout/gsm_widget.xml
      - name: Commit source polish
        shell: bash
        run: |
          if git diff --quiet; then echo 'No source changes to commit.'; exit 0; fi
          git config user.name 'Vipul Shegur'
          git config user.email 'vsshegur@gmail.com'
          git add android internal/app
          git commit -m 'Apply TallyBridge 2.5.2 final polish'
          git push origin final-polish-2.5.2
