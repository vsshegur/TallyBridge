name: Validate TallyBridge 2.5.0 branch
on:
  push:
    branches: [upgrade-2.5.0]
    paths: ['.github/workflows/validate-v250.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: upgrade-2.5.0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.12', cache: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Go tests and vet
        run: |
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge
          GOOS=windows GOARCH=amd64 go build ./cmd/tallybridge
          GOOS=windows GOARCH=amd64 go build ./cmd/uninstall
      - name: Android unit compile lint debug
        working-directory: android
        run: gradle --no-daemon test assembleDebug lintDebug assembleDebugAndroidTest
      - name: Android R8 optimized release
        working-directory: android
        env:
          TB_ALLOW_UNSIGNED_RELEASE: 'true'
        run: gradle --no-daemon assembleRelease lintRelease
# validation revision 3: Work syntax + Follow Up filter + scrollable widget
