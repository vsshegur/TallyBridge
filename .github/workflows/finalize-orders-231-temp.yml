name: Finalize Orders 2.3.1 hardening
on:
  push:
    branches: [hardening/2.3.1-orders]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply already emulator-proven lifecycle patch
        run: python3 scripts/finalize-orders-231.py
      - name: Recompile and lint exact source
        working-directory: android
        run: gradle --no-daemon test assembleDebug assembleDebugAndroidTest lintDebug
      - name: Commit only the verified Android source
        run: |
          git config user.name "TallyBridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/in/tallybridge/app/PhotoOrderActivity.java
          git diff --cached --check
          git commit -m "Close photo-order cleanup race during compression"
          git push origin HEAD:hardening/2.3.1-orders
