name: Apply TallyBridge 2.5.0 upgrade
on:
  push:
    branches: [upgrade-2.5.0]
    paths: ['.github/workflows/apply-v250.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: upgrade-2.5.0}
      - name: Apply 2.5 patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path,old,new):
            p=Path(path); s=p.read_text(encoding='utf-8')
            if old not in s: raise SystemExit(f'pattern missing in {path}: {old[:100]}')
            p.write_text(s.replace(old,new,1),encoding='utf-8')
          # Versions
          rep('android/app/build.gradle',"versionCode 20406\n        versionName '2.4.6'","versionCode 20500\n        versionName '2.5.0'")
          rep('internal/app/types.go','const Version = "2.4.6"','const Version = "2.5.0"')
          rep('android/app/src/main/java/in/tallybridge/app/BridgeApi.java','static final String APP_VERSION="2.4.6";','static final String APP_VERSION="2.5.0";')
          # Expose the real Work/Search/Customer APIs to the authenticated native phone listener.
          rep('internal/app/native.go','"report", "health", "diagnostics", "payment-qr", "update-check"','"report", "health", "diagnostics", "workspace", "alerts", "global-search", "customer-workspace", "tally-performance", "payment-qr", "update-check"')
          # GSM sharing: always offer Business, regular WhatsApp or another app.
          p=Path('android/app/src/main/java/in/tallybridge/app/GsmCalculatorActivity.java');s=p.read_text()
          old='Intent send=new Intent(Intent.ACTION_SEND);send.setType("text/plain");send.putExtra(Intent.EXTRA_TEXT,s.toString());send.setPackage("com.whatsapp");try{startActivity(send);}catch(Exception e){send.setPackage(null);startActivity(Intent.createChooser(send,"Share GSM details"));}'
          if old not in s: raise SystemExit('GSM share pattern missing')
          p.write_text(s.replace(old,'ShareCenter.shareText(this,"Share GSM details",s.toString());',1))
          # Voice order: dedicated action auto-starts existing speech parser, but still requires review before save.
          rep('android/app/src/main/java/in/tallybridge/app/OrdersActivity.java','static final String ACTION_NEW="in.tallybridge.app.ORDER_NEW", ACTION_QUICK="in.tallybridge.app.ORDER_QUICK";','static final String ACTION_NEW="in.tallybridge.app.ORDER_NEW", ACTION_QUICK="in.tallybridge.app.ORDER_QUICK", ACTION_VOICE="in.tallybridge.app.ORDER_VOICE";')
          rep('android/app/src/main/java/in/tallybridge/app/OrdersActivity.java','private boolean dispatchedTab=false,destroyed=false,mastersLoading=false,dark=false,quickMode=false;','private boolean dispatchedTab=false,destroyed=false,mastersLoading=false,dark=false,quickMode=false,voiceMode=false;')
          rep('android/app/src/main/java/in/tallybridge/app/OrdersActivity.java','String action=getIntent().getAction();quickMode=ACTION_QUICK.equals(action);if(ACTION_NEW.equals(action)||quickMode)openForm(null);else showOrders();','String action=getIntent().getAction();quickMode=ACTION_QUICK.equals(action);voiceMode=ACTION_VOICE.equals(action);if(ACTION_NEW.equals(action)||quickMode||voiceMode)openForm(null);else showOrders();')
          rep('android/app/src/main/java/in/tallybridge/app/OrdersActivity.java','if(order==null)body.addView(btn("🎙 Speak order",v->startVoiceOrder(buyer,notes,itemsBox)),full(8));body.addView(primary(order==null?(quickMode?"Save quick order":"Save pending order"):"Update pending order",v->saveForm(order,companySpin,buyer,dispatchedThrough,notes)),full(18));','if(order==null){body.addView(btn("🎙 Speak order",v->startVoiceOrder(buyer,notes,itemsBox)),full(8));if(voiceMode){voiceMode=false;main.postDelayed(()->startVoiceOrder(buyer,notes,itemsBox),700);}}body.addView(primary(order==null?(quickMode?"Save quick order":"Save pending order"):"Update pending order",v->saveForm(order,companySpin,buyer,dispatchedThrough,notes)),full(18));')
          # Reports: remove accounting statements user does not need; route to 2.5 screens.
          rep('android/app/src/main/java/in/tallybridge/app/MainActivity.java','data.add(row("Customer 360","Choose a customer from Ledgers","",()->open(()->ledgers(false))));','data.add(row("Customer 360","Search any customer and open the complete relationship view","",()->startActivity(new Intent(this,UniversalSearchActivity.class).putExtra(UniversalSearchActivity.EXTRA_MODE,UniversalSearchActivity.MODE_CUSTOMERS))));')
          rep('android/app/src/main/java/in/tallybridge/app/MainActivity.java','data.add(heading("Accounting","Read-only Tally reports"));\n  for(String n:new String[]{"Day Book","Trial Balance","Profit and Loss","Balance Sheet"}){String report=n;data.add(row(report,"Accounting report","",()->open(()->genericReport(report))));}','data.add(heading("Activity","Useful daily Tally activity"));\n  data.add(row("Day Book","Read-only daily voucher activity","",()->open(()->genericReport("Day Book"))));')
          rep('android/app/src/main/java/in/tallybridge/app/MainActivity.java','data.add(row("Universal search","Customers, invoices and LR/RR numbers","",()->open(this::search)));','data.add(row("Universal search","Customers, invoices, orders, items, LR/RR, GSTIN and mobile","",()->startActivity(new Intent(this,UniversalSearchActivity.class))));')
          # Manifest: new native screens, collection service and separate widgets.
          rep('android/app/src/main/AndroidManifest.xml','<activity android:name=".WorkActivity" android:exported="false" android:label="Today" />','<activity android:name=".WorkActivity" android:exported="false" android:label="Work" />\n        <activity android:name=".UniversalSearchActivity" android:exported="false" android:label="Universal Search" android:windowSoftInputMode="adjustResize" />\n        <activity android:name=".Customer360Activity" android:exported="false" android:label="Customer 360" />')
          rep('android/app/src/main/AndroidManifest.xml','<receiver android:name=".OrdersWidget" android:exported="false">','<service android:name=".OrdersWidgetService" android:permission="android.permission.BIND_REMOTEVIEWS" android:exported="false" />\n        <receiver android:name=".OrdersWidget" android:exported="false">')
          anchor='''        <receiver android:name=".ProformaWidget" android:exported="false">'''
          insert='''        <receiver android:name=".GsmWidget" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/gsm_widget_info" /></receiver>\n        <receiver android:name=".SearchWidget" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/search_widget_info" /></receiver>\n        <receiver android:name=".VoiceOrderWidget" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/voice_order_widget_info" /></receiver>\n'''+anchor
          rep('android/app/src/main/AndroidManifest.xml',anchor,insert)
          # Mini Mode routes.
          rep('internal/app/server.go','m.HandleFunc("/admin", s.localAdmin(s.serveFile("web/admin.html", "text/html; charset=utf-8")))','m.HandleFunc("/admin", s.localAdmin(s.serveFile("web/admin.html", "text/html; charset=utf-8")))\n\tm.HandleFunc("/mini", s.localAdmin(s.serveFile("web/mini.html", "text/html; charset=utf-8")))')
          rep('internal/app/server.go','m.HandleFunc("/api/v1/admin/snapshot", s.localAdmin(s.handleAdminSnapshot))','m.HandleFunc("/api/v1/admin/snapshot", s.localAdmin(s.handleAdminSnapshot))\n\tm.HandleFunc("/api/v1/admin/restart", s.localAdmin(s.handleAdminRestart))')
          # Windows restart primitive used by Mini Mode.
          rep('internal/app/platform_windows.go','"strings"\n\t"syscall"','"strings"\n\t"syscall"\n\t"time"')
          p=Path('internal/app/platform_windows.go');s=p.read_text();needle='func openDesktop(url string) error {';at=s.index(needle);end=s.index('\n}',at)+2
          addition='''\nfunc restartDesktopProcess() error {\n\texe, err := os.Executable(); if err != nil { return err }\n\tcommand := fmt.Sprintf(`ping 127.0.0.1 -n 3 >nul & start "" "%s" --background`, exe)\n\tcmd := hiddenCmd("cmd.exe", "/C", command); if err := cmd.Start(); err != nil { return err }\n\tgo func(){ time.Sleep(350*time.Millisecond); os.Exit(0) }()\n\treturn nil\n}\n'''
          s=s[:end]+addition+s[end:];p.write_text(s)
          rep('internal/app/platform_other.go','func openDesktop(url string) error { fmt.Println("TallyBridge:", url); return nil }','func openDesktop(url string) error { fmt.Println("TallyBridge:", url); return nil }\nfunc restartDesktopProcess() error { return errors.New("restart is available on Windows") }')
          # Tray Mini Mode command.
          rep('cmd/tallybridge/tray_windows.go','cmdExit        = 1004','cmdExit        = 1004\n\tcmdMini        = 1005')
          rep('cmd/tallybridge/tray_windows.go','func openTrayAdmin(){if trayAdminURL!=""{go app.OpenDesktop(trayAdminURL)}}','func openTrayAdmin(){if trayAdminURL!=""{go app.OpenDesktop(trayAdminURL)}}\nfunc openTrayMini(){if trayAdminURL!=""{u:=trayAdminURL;if len(u)>=6&&u[len(u)-6:]=="/admin"{u=u[:len(u)-6]+"/mini"};go app.OpenDesktop(u)}}')
          rep('cmd/tallybridge/tray_windows.go','procAppendMenu.Call(menu,mfString,cmdOpen,uintptr(unsafe.Pointer(utf16Ptr("Open TallyBridge"))))','procAppendMenu.Call(menu,mfString,cmdOpen,uintptr(unsafe.Pointer(utf16Ptr("Open TallyBridge"))))\n\tprocAppendMenu.Call(menu,mfString,cmdMini,uintptr(unsafe.Pointer(utf16Ptr("Mini Mode"))))')
          rep('cmd/tallybridge/tray_windows.go','switch cmd{case cmdOpen:openTrayAdmin();case cmdDiagnostics:','switch cmd{case cmdOpen:openTrayAdmin();case cmdMini:openTrayMini();case cmdDiagnostics:')
          PY
      - name: Verify formatting-sensitive sources
        run: |
          gofmt -w internal/app/types.go internal/app/native.go internal/app/server.go internal/app/platform_windows.go internal/app/platform_other.go internal/app/mini.go cmd/tallybridge/tray_windows.go
      - name: Commit upgrade patch
        run: |
          git config user.name "Vipul Shegur"
          git config user.email "vsshegur@gmail.com"
          git add -A
          git commit -m "Wire TallyBridge 2.5.0 features"
          git push origin upgrade-2.5.0
