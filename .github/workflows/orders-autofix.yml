name: Apply Orders branch fixes
on:
  push:
    branches: [feature/orders-workflow]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/orders-workflow
          fetch-depth: 0
      - name: Apply isolated feature fixes
        shell: python
        run: |
          from pathlib import Path

          activity = Path('android/app/src/main/java/in/tallybridge/app/OrdersActivity.java')
          text = activity.read_text()
          old = ' private void fetchBuyer(String company,String buyer,TextView info){buyer=buyer.trim();if(buyer.isEmpty())return;String path=BridgeApi.path("ledger-details",company,"ledger",buyer);get(path,x->{JSONObject d=x.optJSONObject("details");buyerDetails=d==null?new JSONObject():d;buyerDetailsFor=buyer;info.setText(buyerSummary(buyerDetails));});}'
          new = ' private void fetchBuyer(String company,String buyer,TextView info){String selectedBuyer=buyer.trim();if(selectedBuyer.isEmpty())return;String path=BridgeApi.path("ledger-details",company,"ledger",selectedBuyer);get(path,x->{JSONObject d=x.optJSONObject("details");buyerDetails=d==null?new JSONObject():d;buyerDetailsFor=selectedBuyer;info.setText(buyerSummary(buyerDetails));});}'
          if old in text:
              activity.write_text(text.replace(old, new))

          main = Path('android/app/src/main/java/in/tallybridge/app/MainActivity.java')
          text = main.read_text()
          anchor = '  quick(page,"share","Today\'s dispatch","Open and share today\'s invoices",()->open(this::dispatch));\n'
          orders = '  quick(page,"Reports","Orders","Take a new order or review pending orders",()->startActivity(new Intent(this,OrdersActivity.class)));\n'
          if orders not in text and anchor in text:
              main.write_text(text.replace(anchor, anchor + orders))

          verify = Path('.github/workflows/orders-verify.yml')
          text = verify.read_text()
          text = text.replace('go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall', 'go vet ./internal/app ./cmd/tallybridge')
          verify.write_text(text)
      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            echo "No fixes needed"
            exit 0
          fi
          git config user.name "TallyBridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/in/tallybridge/app/OrdersActivity.java android/app/src/main/java/in/tallybridge/app/MainActivity.java .github/workflows/orders-verify.yml
          git commit -m "Fix Orders Android build and add in-app entry"
          git push origin HEAD:feature/orders-workflow
