name: Build compressed final Android release

on:
  push:
    branches:
      - build/final-production-2.4.1-20261004

permissions:
  contents: read

jobs:
  android-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and lint debug build
        working-directory: android
        run: gradle --no-daemon test assembleDebug lintDebug
      - name: Build R8/resource-shrunk unsigned release
        working-directory: android
        env:
          CI: 'false'
        run: |
          gradle --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Package signing tools
        shell: bash
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$BUILD_TOOLS"
          mkdir -p signing-tools/lib
          cp "$BUILD_TOOLS/apksigner" signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" signing-tools/lib/
          cp "$BUILD_TOOLS/zipalign" signing-tools/
          chmod +x signing-tools/apksigner signing-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-Android-2.4.1-Compressed-Unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/mapping/release/mapping.txt
            signing-tools/**
          if-no-files-found: error
