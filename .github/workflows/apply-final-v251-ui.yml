name: Apply TallyBridge 2.5.1 UI polish
on:
  push:
    branches: [final-2.5.1]
    paths: ['.github/workflows/apply-final-v251-ui.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: final-2.5.1}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.12', cache: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Apply UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Android Home: daily actions first, then money overview, then reports.
          p=Path('android/app/src/main/java/in/tallybridge/app/MainActivity.java');s=p.read_text(encoding='utf-8')
          old='''  TextView moneyTitle=text("MONEY OVERVIEW",11,MUTED);moneyTitle.setTypeface(null,Typeface.BOLD);moneyTitle.setLetterSpacing(.10f);page.addView(moneyTitle);gap(page,8);\n  metric(page,"Receivable",amountOrMissing(sm,"receivable"),time(sm.optString("rFetchedAt")),"receive",true,()->open(()->outstanding("receivable")));\n  metric(page,"Payable",amountOrMissing(sm,"payable"),time(sm.optString("pFetchedAt")),"pay",false,()->open(()->outstanding("payable")));\n  metric(page,"Sales this month",amountOrMissing(sm,"sales"),time(sm.optString("sFetchedAt")),"Reports",false,()->open(()->register("sales")));\n  gap(page,8);TextView workTitle=text("QUICK ACTIONS",11,MUTED);workTitle.setTypeface(null,Typeface.BOLD);workTitle.setLetterSpacing(.10f);page.addView(workTitle);gap(page,8);\n  quick(page,"Reports","New order","Create an order quickly • works offline",()->{Intent i=new Intent(this,OrdersActivity.class);i.setAction(OrdersActivity.ACTION_QUICK);startActivity(i);});\n  quick(page,"health","Today's work","Pending orders, dispatch and items needing attention",()->startActivity(new Intent(this,WorkActivity.class)));\n  quick(page,"calculator","GSM calculator","Calculate towel GSM from size and weight • offline",()->startActivity(new Intent(this,GsmCalculatorActivity.class)));\n  quick(page,"Proforma","Proforma invoice","Create and share a proforma invoice",()->rootTab("Proforma"));\n  gap(page,8);TextView reportTitle=text("REPORTS & SEARCH",11,MUTED);reportTitle.setTypeface(null,Typeface.BOLD);reportTitle.setLetterSpacing(.10f);page.addView(reportTitle);gap(page,8);\n  quick(page,"Reports","Sales register","Month-wise invoices with verified totals",()->open(()->register("sales")));\n  quick(page,"share","Today's dispatch","Open and share today's invoices",()->open(this::dispatch));\n  quick(page,"search","Search everything","Customers, invoices and LR/RR numbers",()->open(this::search));\n  quick(page,"health","Company health",healthLine,()->open(this::healthScreen));\n'''
          new='''  TextView workTitle=text("QUICK ACTIONS",11,MUTED);workTitle.setTypeface(null,Typeface.BOLD);workTitle.setLetterSpacing(.10f);page.addView(workTitle);gap(page,8);\n  quick(page,"search","Search everything","Customers, invoices, orders, items and LR/RR numbers",()->startActivity(new Intent(this,UniversalSearchActivity.class)));\n  quick(page,"Reports","New order","Create an order quickly • works offline",()->{Intent i=new Intent(this,OrdersActivity.class);i.setAction(OrdersActivity.ACTION_QUICK);startActivity(i);});\n  quick(page,"health","Today's work","Pending orders, dispatch, business status and items needing attention",()->startActivity(new Intent(this,WorkActivity.class)));\n  quick(page,"calculator","GSM calculator","Calculate towel GSM from size and weight • offline",()->startActivity(new Intent(this,GsmCalculatorActivity.class)));\n  quick(page,"Proforma","Proforma invoice","Create and share a proforma invoice",()->rootTab("Proforma"));\n  gap(page,10);TextView moneyTitle=text("MONEY OVERVIEW",11,MUTED);moneyTitle.setTypeface(null,Typeface.BOLD);moneyTitle.setLetterSpacing(.10f);page.addView(moneyTitle);gap(page,8);\n  metric(page,"Receivable",amountOrMissing(sm,"receivable"),time(sm.optString("rFetchedAt")),"receive",true,()->open(()->outstanding("receivable")));\n  metric(page,"Payable",amountOrMissing(sm,"payable"),time(sm.optString("pFetchedAt")),"pay",false,()->open(()->outstanding("payable")));\n  metric(page,"Sales this month",amountOrMissing(sm,"sales"),time(sm.optString("sFetchedAt")),"Reports",false,()->open(()->register("sales")));\n  gap(page,8);TextView reportTitle=text("REPORTS & MORE",11,MUTED);reportTitle.setTypeface(null,Typeface.BOLD);reportTitle.setLetterSpacing(.10f);page.addView(reportTitle);gap(page,8);\n  quick(page,"Reports","Sales register","Month-wise invoices with verified totals",()->open(()->register("sales")));\n  quick(page,"share","Today's dispatch","Open and share today's invoices",()->open(this::dispatch));\n  quick(page,"health","Company health",healthLine,()->open(this::healthScreen));\n'''
          if old not in s: raise SystemExit('Android Home block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Windows Control Center company sync controls.
          p=Path('internal/app/web/admin.js');s=p.read_text(encoding='utf-8')
          s=s.replace('v2.4.6 • dark control center • read-only Tally access','v2.5.1 FINAL • read-only Tally access',1)
          old="if(route==='companies')return JSON.stringify([route,!!l.tallyOnline,(l.companies||[]).map(x=>[x.id,x.name]),cc.map(x=>[x.id,x.name]),l.lastError,a.running]);"
          new="if(route==='companies')return JSON.stringify([route,!!l.tallyOnline,(l.companies||[]).map(x=>[x.id,x.name]),cc.map(x=>[x.id,x.name]),l.lastError,a.running,d.settings?.syncExcludedCompanies||[]]);"
          if old not in s: raise SystemExit('companies renderKey missing')
          s=s.replace(old,new,1)
          old="if(route==='live')return JSON.stringify([route,a.running,a.company,a.step,a.lastOk,a.lastError,c.entries,c.latestAt,cc.map(x=>x.name)]);"
          new="if(route==='live')return JSON.stringify([route,a.running,a.company,a.step,a.lastOk,a.lastError,c.entries,c.latestAt,cc.map(x=>x.name),d.settings?.syncExcludedCompanies||[]]);"
          if old not in s: raise SystemExit('live renderKey missing')
          s=s.replace(old,new,1)

          start=s.index('function renderCompanies(){');end=s.index('function renderDevices(){',start)
          companies='''function renderCompanies(){const live=snap.live?.companies||[],saved=snap.cachedCompanies||[],excludedNames=snap.settings?.syncExcludedCompanies||[],excluded=new Set(excludedNames.map(n=>String(n).trim().toLowerCase()).filter(Boolean)),seen=new Set(),rows=[];const add=(x,m)=>{const name=String(x?.name||'').trim(),key=name.toLowerCase();if(!name||seen.has(key))return;seen.add(key);rows.push([{...x,name},m,excluded.has(key)])};live.forEach(x=>add(x,'LIVE'));saved.forEach(x=>add(x,'SAVED'));excludedNames.forEach(name=>add({name},'SAVED'));$('#page').innerHTML=head('Companies','Choose exactly which Tally companies should sync to the phone. Removing one here never deletes or changes it inside TallyPrime.')+`${rows.length?`<div class="card">${rows.map(([x,m,off])=>`<div class="list-row"><div><div class="title">${esc(x.name)}</div><div class="sub">${off?'Excluded from automatic sync and the Android company list':m==='LIVE'?'Currently verified from TallyPrime • automatic sync enabled':'Available from saved company list • automatic sync enabled'}</div></div><div class="toolbar" style="margin:0"><span class="status-pill ${off?'warn':m==='LIVE'?'ok':'warn'}">${off?'NOT SYNCING':m}</span><button class="btn ${off?'secondary':'danger'}" data-action="company-sync" data-name="${esc(x.name)}" data-enabled="${off?'1':'0'}">${off?'Add to Sync':'Remove from Sync'}</button></div></div>`).join('')}</div>`:'<div class="empty">No company known yet. Open a company in TallyPrime; automatic sync will discover it.</div>'}`}\n'''
          s=s[:start]+companies+s[end:]

          start=s.index('function renderLive(){');end=s.index('let healthCompany',start)
          live='''function renderLive(){const live=snap.live?.companies||[],saved=snap.cachedCompanies||[],excludedNames=snap.settings?.syncExcludedCompanies||[],excluded=new Set(excludedNames.map(n=>String(n).trim().toLowerCase()).filter(Boolean)),names=[...new Set([...live,...saved].map(x=>x.name).filter(Boolean))].filter(n=>!excluded.has(String(n).trim().toLowerCase())),a=snap.autoSync||{},c=snap.cache||{};$('#page').innerHTML=head('Automatic Sync','Only companies enabled in Companies are refreshed and sent to Android.')+`<div class="grid"><div class="card span6"><div class="metric-label">Status</div><div class="metric-value">${a.running?'SYNCING':'AUTO SYNC ON'}</div><div class="metric-sub">${a.running?esc((a.company||'All enabled companies')+' • '+(a.step||'Starting')):(a.lastOk&&!String(a.lastOk).startsWith('0001')?'Last complete '+fmtAgo(a.lastOk):'Waiting for first complete sync')}</div></div><div class="card span6"><div class="metric-label">Latest saved data</div><div class="metric-value" style="font-size:18px">${c.latestAt&&!String(c.latestAt).startsWith('0001')?fmtAgo(c.latestAt):'Not yet'}</div><div class="metric-sub">PC-local last-known-good copy</div></div></div>${a.lastError?`<div class="notice warn" style="margin-top:14px"><b>Last automatic attempt stopped safely:</b> ${esc(a.lastError)}<br>TallyBridge will retry automatically. Existing saved data is untouched.</div>`:`<div class="notice ok" style="margin-top:14px"><b>No action required.</b> Automatic sync runs after startup and every 3 minutes.</div>`}${excludedNames.length?`<div class="notice info" style="margin-top:12px"><b>${excludedNames.length} compan${excludedNames.length===1?'y is':'ies are'} excluded from sync.</b> Open Companies to add them back.</div>`:''}${names.length?`<div class="section-title">Companies being synced</div><div class="card">${names.map(n=>`<div class="list-row"><div><div class="title">${esc(n)}</div><div class="sub">Ledger index → Receivable → Sales this month → Payable</div></div><span class="status-pill ok">AUTO</span></div>`).join('')}</div>`:'<div class="empty" style="margin-top:14px">No company is currently enabled for automatic sync. Open Companies to add one back.</div>'}<div class="toolbar" style="margin-top:14px"><button class="btn secondary" data-action="sync-now">Sync now (optional)</button></div><div class="notice info" style="margin-top:12px">The worker always uses one Tally request at a time and stops immediately on the first timeout or error.</div>`}\n'''
          s=s[:start]+live+s[end:]

          marker="}else if(a==='save-settings'){"
          action="""}else if(a==='company-sync'){const enabled=b.dataset.enabled==='1',name=b.dataset.name||'';if(!name)throw new Error('Company name missing');if(!enabled&&!confirm(`Remove ${name} from automatic sync?\\n\\nIt will disappear from the Android company list, but nothing will be deleted from TallyPrime.`))return;await api('/api/v1/admin/company-sync',{method:'POST',body:JSON.stringify({company:name,enabled})});toast(enabled?`${name} added back to sync`:`${name} removed from sync`);await loadSnapshot(true)}else if(a==='save-settings'){"""
          if marker not in s: raise SystemExit('save settings action marker missing')
          p.write_text(s.replace(marker,action,1),encoding='utf-8')
          PY
          node --check internal/app/web/admin.js
          go test ./internal/app
          cd android && gradle --no-daemon test assembleDebug lintDebug
      - name: Commit UI polish
        run: |
          git config user.name "Vipul Shegur"
          git config user.email "vsshegur@gmail.com"
          git add internal/app/web/admin.js android/app/src/main/java/in/tallybridge/app/MainActivity.java
          git commit -m "Polish final Home and company sync controls"
          git push origin final-2.5.1
