name: Fix Work syntax
on:
  push:
    paths:
      - '.github/workflows/fix-work-syntax.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair WorkActivity loadToday syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/in/tallybridge/app/WorkActivity.java')
          s=p.read_text()
          bad='private void loadToday(){busy(true);work.execute(()->{try{JSONObject x=api.get(path("workspace"));main.post(()->{if(destroyed)return;busy(false);renderToday(x);});}catch(Exception advanced){try{JSONObject x=compatibilityToday();main.post(()->{if(destroyed)return;busy(false);renderToday(x);});}catch(Exception fallback){main.post(()->{if(destroyed)return;busy(false);card("Could not load Today",fallback.getMessage()==null?"PC connection unavailable":fallback.getMessage(),"",v->loadToday());});}}}});}'
          good='private void loadToday(){busy(true);work.execute(()->{try{JSONObject x=api.get(path("workspace"));main.post(()->{if(destroyed)return;busy(false);renderToday(x);});}catch(Exception advanced){try{JSONObject x=compatibilityToday();main.post(()->{if(destroyed)return;busy(false);renderToday(x);});}catch(Exception fallback){main.post(()->{if(destroyed)return;busy(false);card("Could not load Today",fallback.getMessage()==null?"PC connection unavailable":fallback.getMessage(),"",v->loadToday());});}}});}'
          if s.count(bad)!=1:
              raise SystemExit(f'Expected one broken loadToday block, found {s.count(bad)}')
          p.write_text(s.replace(bad,good,1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Vipul Shegur"
          git config user.email "vsshegur@gmail.com"
          git add android/app/src/main/java/in/tallybridge/app/WorkActivity.java
          git diff --cached --check
          git commit -m "Fix Work Today compatibility syntax"
          git push origin HEAD:main
