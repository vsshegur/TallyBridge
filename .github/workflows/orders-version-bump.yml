name: Align Orders release version
on:
  push:
    branches: [feature/orders-workflow]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/orders-workflow
          fetch-depth: 0
      - name: Set TallyBridge 2.2.0 version
        shell: python
        run: |
          from pathlib import Path
          p=Path('internal/app/types.go')
          s=p.read_text().replace('const Version = "2.1.3"','const Version = "2.2.0"')
          p.write_text(s)
          p=Path('android/app/build.gradle')
          s=p.read_text().replace('versionCode 20103','versionCode 20200').replace("versionName '2.1.3'","versionName '2.2.0'")
          p.write_text(s)
      - name: Commit version alignment
        run: |
          if git diff --quiet; then
            echo "Version already aligned"
            exit 0
          fi
          git config user.name "TallyBridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add internal/app/types.go android/app/build.gradle
          git commit -m "Set Orders feature version to 2.2.0"
          git push origin HEAD:feature/orders-workflow
