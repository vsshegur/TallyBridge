name: Verify Operations Center 2.4.0

on:
  push:
    branches: [feature/operations-center-2.4.0]
    paths:
      - scripts/apply_operations_240.py
      - .github/workflows/operations-240-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operations-center-2.4.0
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply guarded source patch
        run: python3 scripts/apply_operations_240.py
      - name: Format Go
        run: gofmt -w internal/app/*.go
      - name: Backend tests and vet
        run: |
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge
          GOOS=windows GOARCH=amd64 go build ./cmd/tallybridge
      - name: Desktop JavaScript syntax
        run: |
          node --check internal/app/web/admin.js
          node --check internal/app/web/orders.js
          node --check internal/app/web/operations.js
      - name: Android build lint and test APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Commit verified source
        run: |
          git config user.name 'TallyBridge CI'
          git config user.email 'actions@users.noreply.github.com'
          git add internal android .github/workflows/release.yml
          git diff --cached --check
          git commit -m 'Build Operations Center 2.4.0 [ops-auto]'
          git push origin HEAD:feature/operations-center-2.4.0
