name: Finalize 2.4.6 Android cleanup

on:
  push:
    paths:
      - '.github/workflows/reorg-v246.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dead Work paths and improve return navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path=Path('android/app/src/main/java/in/tallybridge/app/MainActivity.java')
          s=main_path.read_text(encoding='utf-8')
          s=s.replace('if(ACTION_SEARCH.equals(action)){history.clear();tab="Home";open(this::search);return;}', 'if(ACTION_SEARCH.equals(action)){history.clear();history.push(()->rootTab("Work"));tab="Home";search();return;}')
          s=s.replace('if(ACTION_CUSTOMERS.equals(action)){history.clear();tab="Reports";open(()->ledgers(false));return;}', 'if(ACTION_CUSTOMERS.equals(action)){history.clear();history.push(()->rootTab("Work"));tab="Reports";ledgers(false);return;}')
          s=s.replace('if(ACTION_SYSTEM.equals(action)){rootTab("More");return;}', 'if(ACTION_SYSTEM.equals(action)){history.clear();history.push(()->rootTab("Work"));tab="More";diagnosticsScreen();return;}')
          main_path.write_text(s,encoding='utf-8')

          work_path=Path('android/app/src/main/java/in/tallybridge/app/WorkActivity.java')
          s=work_path.read_text(encoding='utf-8')
          # Remove obsolete duplicate Search/Customer/Follow-up implementation. The tabs now use MainActivity core screens.
          s,n=re.subn(r'\n private void showSearch\(\).*?\n private void showTools\(\)', '\n private void showTools()', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('could not remove obsolete Work search/customer/follow-up block')
          # Remove obsolete multi-endpoint System implementation; System now opens core Diagnostics.
          s,n=re.subn(r'\n private void showSystem\(\).*?\n private String version\(\)\{.*?\}\n\}', '\n}', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('could not remove obsolete Work system block')
          # Keep activity transitions inside a single app shell rather than stacking Work/Orders repeatedly.
          s=s.replace('v->startActivity(new Intent(this,OrdersActivity.class))', 'v->SectionNav.go(this,"Orders")')
          s=s.replace('v->{Intent i=new Intent(this,OrdersActivity.class);i.setAction(OrdersActivity.ACTION_QUICK);startActivity(i);}', 'v->{Intent i=new Intent(this,OrdersActivity.class);i.setAction(OrdersActivity.ACTION_QUICK);startActivity(i);finish();overridePendingTransition(0,0);}')
          # Any Today alert that is not Orders/Tools uses reliable core Diagnostics.
          s=re.sub(r'box\.setOnClickListener\(v->\{.*?\}\);body\.addView\(box,full\(7\)\);', 'box.setOnClickListener(v->{if("orders".equals(action))SectionNav.go(this,"Orders");else if("tools".equals(action))showTools();else openMain(MainActivity.ACTION_SYSTEM);});body.addView(box,full(7));', s, count=1, flags=re.S)
          work_path.write_text(s,encoding='utf-8')

          # Assertions: Follow Up and old broken advanced UI are gone from WorkActivity.
          s=work_path.read_text(encoding='utf-8')
          forbidden=['showFollowUps','followUpDialog','customer-workspace','global-search','tally-performance','System check failed','Payment follow-ups']
          leftovers=[x for x in forbidden if x in s]
          if leftovers: raise SystemExit('dead Work code remains: '+', '.join(leftovers))
          m=main_path.read_text(encoding='utf-8')
          if 'diagnosticsScreen();return;' not in m or 'history.push(()->rootTab("Work"))' not in m:
              raise SystemExit('core Work return routing missing')
          print('Work cleanup verified')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "Vipul Shegur"
          git config user.email "vsshegur@gmail.com"
          git add android/app/src/main/java/in/tallybridge/app/MainActivity.java android/app/src/main/java/in/tallybridge/app/WorkActivity.java
          git commit -m "Remove obsolete Work paths and use core diagnostics"
          git push
