name: Reorganize 2.4.6 Android and Windows

on:
  push:
    paths:
      - '.github/workflows/reorg-v246.yml'

permissions:
  contents: write

jobs:
  reorg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 2.4.6 reorganization
        run: python3 .github/scripts/reorg_v246.py
      - name: Commit reorganization
        run: |
          git config user.name "Vipul Shegur"
          git config user.email "vsshegur@gmail.com"
          git add android internal
          git commit -m "Reorganize Android app and redesign Windows dark UI"
          git push
