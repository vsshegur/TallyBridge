name: Apply offline Orders compile fix
on:
  push:
    branches: [feature/orders-offline]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/orders-offline
          fetch-depth: 0
      - name: Patch fallback company creation
        shell: python
        run: |
          from pathlib import Path
          p=Path('android/app/src/main/java/in/tallybridge/app/OrdersActivity.java')
          s=p.read_text()
          old='if(companies.length()==0){String c=store.get("company");if(!c.isEmpty())companies.put(new JSONObject().put("name",c));}'
          new='if(companies.length()==0){String c=store.get("company");if(!c.isEmpty()){JSONObject fallback=new JSONObject();try{fallback.put("name",c);companies.put(fallback);}catch(Exception ignored){}}}'
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old,new))
      - name: Commit source fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "TallyBridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/in/tallybridge/app/OrdersActivity.java
          git commit -m "Fix offline Orders fallback company compile"
          git push origin HEAD:feature/orders-offline
