name: Apply TallyBridge 2.5.2 Final Polish
on:
  push:
    branches: [final-polish-2.5.2]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply TallyBridge 2.5.2 final polish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-polish-2.5.2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply final polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rw(path, fn):
              p=Path(path); s=p.read_text(); n=fn(s)
              if n==s: raise SystemExit(f'no change made to {path}')
              p.write_text(n)

          # Versions stay update-compatible with the permanent Android identity.
          rw('android/app/build.gradle', lambda s:s.replace('versionCode 20501','versionCode 20502').replace("versionName '2.5.1'","versionName '2.5.2'"))
          rw('internal/app/types.go', lambda s:s.replace('const Version = "2.5.1"','const Version = "2.5.2"'))
          rw('internal/app/web/admin.js', lambda s:s.replace('v2.5.1 FINAL','v2.5.2 FINAL'))

          # Add group bill-wise endpoint.
          rw('internal/app/server.go', lambda s:s.replace(
              'm.HandleFunc("/api/v1/mobile/group-balances", s.mobileAuth(s.handleGroupBalances))\n\tm.HandleFunc("/api/v1/mobile/group-balances-pdf", s.mobileAuth(s.handleGroupBalancesPDF))',
              'm.HandleFunc("/api/v1/mobile/group-balances", s.mobileAuth(s.handleGroupBalances))\n\tm.HandleFunc("/api/v1/mobile/group-outstanding", s.mobileAuth(s.handleGroupOutstanding))\n\tm.HandleFunc("/api/v1/mobile/group-balances-pdf", s.mobileAuth(s.handleGroupBalancesPDF))'))
          rw('internal/app/native.go', lambda s:s.replace('"group-balances", "group-balances-pdf"','"group-balances", "group-outstanding", "group-balances-pdf"'))

          Path('internal/app/group_outstanding.go').write_text(r'''package app

import (
    "errors"
    "fmt"
    "net/http"
    "strings"
    "time"
)

type GroupOutstandingData struct {
    CommonData
    Company        string    `json:"company"`
    Group          string    `json:"group"`
    Bills          []BillRow `json:"bills"`
    Total          float64   `json:"total"`
    Count          int       `json:"count"`
    ShareText      string    `json:"shareText"`
    PartialLedgers []string  `json:"partialLedgers,omitempty"`
}

func prettyBillDate(v string) string {
    if d, e := time.Parse("2006-01-02", normISODate(v)); e == nil {
        return d.Format("02 Jan 2006")
    }
    if strings.TrimSpace(v) == "" { return "Not available" }
    return v
}

func groupOutstandingShareText(x GroupOutstandingData) string {
    var b strings.Builder
    b.WriteString("*Outstanding by Group*\n")
    fmt.Fprintf(&b, "Company: %s\nGroup: %s\n", x.Company, x.Group)
    fmt.Fprintf(&b, "Pending bills: %d\nTotal pending: ₹%s\n", x.Count, indianNumber(x.Total))
    b.WriteString("Oldest bill first\n")
    for i, bill := range x.Bills {
        fmt.Fprintf(&b, "\n*%d. %s*\n", i+1, bill.Party)
        fmt.Fprintf(&b, "Bill date: %s\n", prettyBillDate(bill.Date))
        fmt.Fprintf(&b, "Invoice: %s\n", bill.BillNumber)
        fmt.Fprintf(&b, "Amount: ₹%s", indianNumber(bill.PendingAmount))
        if bill.DrCr != "" { fmt.Fprintf(&b, " %s", bill.DrCr) }
        b.WriteString("\n")
        if bill.InvoiceDays >= 0 { fmt.Fprintf(&b, "Age: %d days\n", bill.InvoiceDays) }
    }
    if len(x.PartialLedgers) > 0 {
        fmt.Fprintf(&b, "\nNote: Bill-wise breakup was unavailable for %d ledger(s).\n", len(x.PartialLedgers))
    }
    return strings.TrimSpace(b.String())
}

func (s *Server) getGroupOutstanding(company, group string) (GroupOutstandingData, error) {
    gb, err := s.getGroupBalances(company, group)
    if err != nil { return GroupOutstandingData{}, err }
    out := GroupOutstandingData{CommonData: gb.CommonData, Company: company, Group: group}
    out.Live = true
    out.Source = "live"
    out.FetchedAt = time.Now()
    for _, row := range gb.Ledgers {
        if row.Balance == 0 || strings.TrimSpace(row.Ledger) == "" { continue }
        led, e := s.getLedgerOutstanding(company, row.Ledger)
        if e != nil || led.SummaryOnly || len(led.Bills) == 0 {
            out.PartialLedgers = append(out.PartialLedgers, row.Ledger)
            out.Live = false
            out.Source = "mixed"
            continue
        }
        if !led.Live { out.Live = false; out.Source = "mixed" }
        for _, bill := range led.Bills {
            bill.Party = row.Ledger
            bill.Date = normISODate(bill.Date)
            bill.InvoiceDays = invoiceDays(bill.Date)
            if bill.PendingAmount == 0 { bill.PendingAmount = abs(bill.SignedAmount) }
            out.Bills = append(out.Bills, bill)
            out.Total += abs(bill.PendingAmount)
        }
    }
    out.Bills = sortedBills(out.Bills)
    out.Count = len(out.Bills)
    if out.Count == 0 && len(out.PartialLedgers) > 0 {
        return out, errors.New("bill-wise outstanding is not available yet; open the affected ledger outstanding once and retry")
    }
    out.ShareText = groupOutstandingShareText(out)
    return out, nil
}

func (s *Server) handleGroupOutstanding(w http.ResponseWriter, r *http.Request) {
    c, g := strings.TrimSpace(r.URL.Query().Get("company")), strings.TrimSpace(r.URL.Query().Get("group"))
    if c == "" || g == "" { jsonErr(w, 400, errors.New("company and group required")); return }
    x, e := s.getGroupOutstanding(c, g)
    if e != nil { jsonErr(w, 503, e); return }
    jsonOut(w, x)
}
''')

