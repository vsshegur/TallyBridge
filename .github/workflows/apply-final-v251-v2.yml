name: Apply TallyBridge 2.5.1 robust final patch
on:
  push:
    branches: [final-2.5.1]
    paths: ['.github/workflows/apply-final-v251-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: final-2.5.1}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.12', cache: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def rep(path,old,new,label):
            p=Path(path);s=p.read_text(encoding='utf-8')
            if old not in s: raise SystemExit(label+' missing')
            p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Backend version/settings.
          rep('internal/app/types.go','const Version = "2.5.0"','const Version = "2.5.1"','version')
          rep('internal/app/types.go','\tAutoUpdate  bool   `json:"autoUpdate"`\n}','\tAutoUpdate  bool   `json:"autoUpdate"`\n\tSyncExcludedCompanies []string `json:"syncExcludedCompanies,omitempty"`\n}','settings field')
          rep('internal/app/store.go','''\t\t\tif json.Unmarshal(b, &raw) == nil {\n\t\t\t\tif _, ok := raw["autoUpdate"]; ok {\n\t\t\t\t\ts.settings.AutoUpdate = x.AutoUpdate\n\t\t\t\t}\n\t\t\t}\n\t\t}\n''','''\t\t\tif json.Unmarshal(b, &raw) == nil {\n\t\t\t\tif _, ok := raw["autoUpdate"]; ok {\n\t\t\t\t\ts.settings.AutoUpdate = x.AutoUpdate\n\t\t\t\t}\n\t\t\t}\n\t\t\ts.settings.SyncExcludedCompanies = append([]string(nil), x.SyncExcludedCompanies...)\n\t\t}\n''','store settings')

          p=Path('internal/app/autosync.go');s=p.read_text(encoding='utf-8')
          anchor='func (s *Server) setAuto(fn func(*AutoSyncState)) { s.mu.Lock(); fn(&s.auto); s.mu.Unlock() }\n'
          helper='''func (s *Server) setAuto(fn func(*AutoSyncState)) { s.mu.Lock(); fn(&s.auto); s.mu.Unlock() }\nfunc companySyncEnabled(cfg Settings, name string) bool {\n\ttarget := strings.TrimSpace(name)\n\tif target == "" { return false }\n\tfor _, x := range cfg.SyncExcludedCompanies { if strings.EqualFold(strings.TrimSpace(x), target) { return false } }\n\treturn true\n}\nfunc filterSyncCompanies(companies []Company, cfg Settings) []Company {\n\tout := make([]Company, 0, len(companies)); seen := map[string]bool{}\n\tfor _, c := range companies { name:=strings.TrimSpace(c.Name); key:=strings.ToLower(name); if name=="" || seen[key] || !companySyncEnabled(cfg,name) { continue }; c.Name=name; out=append(out,c); seen[key]=true }\n\treturn out\n}\nfunc (s *Server) syncCompanyEnabled(name string) bool { return companySyncEnabled(s.store.Settings(), name) }\n'''
          if anchor not in s: raise SystemExit('autosync helper missing')
          s=s.replace(anchor,helper,1)
          s=s.replace('func (s *Server) startAutoSync(company, reason string) bool {\n\ts.mu.Lock()','func (s *Server) startAutoSync(company, reason string) bool {\n\tcompany = strings.TrimSpace(company)\n\tif company != "" && !s.syncCompanyEnabled(company) { return false }\n\ts.mu.Lock()',1)
          s=s.replace('\tcompanies := []string{}\n','\tcompanies := []string{}\n\tdiscovered := 0\n',1)
          pat=r'\t\tfor _, c := range st\.Companies \{\n\t\t\tif c\.Name != "" \{\n\t\t\t\tcompanies = append\(companies, c\.Name\)\n\t\t\t\}\n\t\t\}\n'
          new='''\t\tfor _, c := range st.Companies {\n\t\t\tif strings.TrimSpace(c.Name) != "" { discovered++; if s.syncCompanyEnabled(c.Name) { companies=append(companies,strings.TrimSpace(c.Name)) } }\n\t\t}\n'''
          s,n=re.subn(pat,new,s,count=1);assert n==1,'autosync company loop'
          s,n=re.subn(r'\tif len\(companies\) == 0 \{\n\t\ts\.setAuto\(func\(a \*AutoSyncState\) \{\n\t\t\ta\.LastError = "No open Tally company detected yet"', '\tif len(companies) == 0 {\n\t\ts.setAuto(func(a *AutoSyncState) {\n\t\t\tif discovered > 0 { a.LastError = "No companies are enabled for automatic sync" } else { a.LastError = "No open Tally company detected yet" }',s,count=1);assert n==1,'autosync empty'
          p.write_text(s,encoding='utf-8')

          p=Path('internal/app/server.go');s=p.read_text(encoding='utf-8')
          route='\tm.HandleFunc("/api/v1/admin/settings", s.localAdmin(s.handleSettings))\n';assert route in s
          s=s.replace(route,route+'\tm.HandleFunc("/api/v1/admin/company-sync", s.localAdmin(s.handleCompanySync))\n',1)
          marker='func (s *Server) handleAdminSync(w http.ResponseWriter, r *http.Request) {';assert marker in s
          handler='''func (s *Server) handleCompanySync(w http.ResponseWriter, r *http.Request) {\n\tif r.Method != http.MethodPost { jsonErr(w, 405, errors.New("POST required")); return }\n\tvar q struct { Company string `json:"company"`; Enabled bool `json:"enabled"` }\n\tif readJSON(r, &q) != nil { jsonErr(w, 400, errors.New("invalid company sync request")); return }\n\tname := strings.TrimSpace(q.Company); if name == "" { jsonErr(w, 400, errors.New("company is required")); return }\n\tcfg := s.store.Settings(); next := make([]string, 0, len(cfg.SyncExcludedCompanies)+1)\n\tfor _, x := range cfg.SyncExcludedCompanies { x=strings.TrimSpace(x); if x!="" && !strings.EqualFold(x,name) { next=append(next,x) } }\n\tif !q.Enabled { next=append(next,name) }\n\tsort.Slice(next, func(i,j int) bool { return strings.ToLower(next[i]) < strings.ToLower(next[j]) }); cfg.SyncExcludedCompanies=next\n\tif e:=s.store.UpdateSettings(cfg); e!=nil { jsonErr(w,500,e); return }\n\tjsonOut(w,map[string]any{"ok":true,"company":name,"enabled":q.Enabled,"syncExcludedCompanies":next})\n}\n'''
          s=s.replace(marker,handler+marker,1)
          old='\t_ = readJSON(r, &q)\n\tstarted := s.startAutoSync(q.Company, "desktop")';assert old in s
          s=s.replace(old,'\t_ = readJSON(r, &q)\n\tif strings.TrimSpace(q.Company)!="" && !s.syncCompanyEnabled(q.Company) { jsonErr(w,409,errors.New("company is excluded from sync; add it back in Companies")); return }\n\tstarted := s.startAutoSync(q.Company, "desktop")',1)
          old='''func (s *Server) bootstrapPayload() map[string]any {\n\tst := s.stateSnapshot()\n\tcc, _ := s.cache.Companies()\n\tcs := st.Companies\n\tif len(cs) == 0 {\n\t\tcs = cc\n\t}\n''';assert old in s
          s=s.replace(old,'''func (s *Server) bootstrapPayload() map[string]any {\n\tst := s.stateSnapshot()\n\tcc, _ := s.cache.Companies()\n\tcfg := s.store.Settings()\n\tcs := filterSyncCompanies(st.Companies, cfg)\n\tif len(cs) == 0 { cs = filterSyncCompanies(cc, cfg) }\n''',1)
          dup='\tcfg := s.store.Settings()\n\tif cfg.AutoUpdate {';assert dup in s
          s=s.replace(dup,'\tif cfg.AutoUpdate {',1)
          old='\t_ = readJSON(r, &q)\n\tstarted := s.startAutoSync(q.Company, q.Reason)';assert old in s
          s=s.replace(old,'\t_ = readJSON(r, &q)\n\tif strings.TrimSpace(q.Company)!="" && !s.syncCompanyEnabled(q.Company) { jsonErr(w,409,errors.New("company is excluded from sync on the Windows app")); return }\n\tstarted := s.startAutoSync(q.Company, q.Reason)',1)
          p.write_text(s,encoding='utf-8')
          Path('internal/app/sync_company_test.go').write_text('''package app\nimport("net/http";"net/http/httptest";"strings";"testing")\nfunc TestFilterSyncCompaniesHonorsExclusionsCaseInsensitively(t *testing.T){cfg:=Settings{SyncExcludedCompanies:[]string{"Vipul Textiles"}};got:=filterSyncCompanies([]Company{{Name:"Vijayalaxmi Textiles"},{Name:"VIPUL TEXTILES"}},cfg);if len(got)!=1||got[0].Name!="Vijayalaxmi Textiles"{t.Fatalf("unexpected: %#v",got)}}\nfunc TestCompanySyncEndpointPersistsRemoveAndRestore(t *testing.T){s,e:=NewServer(t.TempDir());if e!=nil{t.Fatal(e)};call:=func(enabled bool){v:="false";if enabled{v="true"};req:=httptest.NewRequest(http.MethodPost,"/api/v1/admin/company-sync",strings.NewReader(`{"company":"Vipul Textiles","enabled":`+v+`}`));rr:=httptest.NewRecorder();s.handleCompanySync(rr,req);if rr.Code!=http.StatusOK{t.Fatalf("%d %s",rr.Code,rr.Body.String())}};call(false);if companySyncEnabled(s.store.Settings(),"vipul textiles"){t.Fatal("remove failed")};call(true);if !companySyncEnabled(s.store.Settings(),"vipul textiles"){t.Fatal("restore failed")}}\n''',encoding='utf-8')

          # Android version and session unlock.
          rep('android/app/build.gradle','versionCode 20500','versionCode 20501','version code');rep('android/app/build.gradle',"versionName '2.5.0'","versionName '2.5.1'",'version name')
          Path('android/app/src/main/java/in/tallybridge/app/AppSession.java').write_text('package in.tallybridge.app; final class AppSession{private static volatile boolean unlocked=false;private AppSession(){}static boolean isUnlocked(){return unlocked;}static void unlock(){unlocked=true;}static void lock(){unlocked=false;}}\n',encoding='utf-8')
          Path('android/app/src/test/java/in/tallybridge/app/AppSessionTest.java').write_text('package in.tallybridge.app; import org.junit.Test; import static org.junit.Assert.*; public class AppSessionTest{@Test public void sharedUnlock(){AppSession.lock();assertFalse(AppSession.isUnlocked());AppSession.unlock();assertTrue(AppSession.isUnlocked());AppSession.lock();}}\n',encoding='utf-8')
          p=Path('android/app/src/main/java/in/tallybridge/app/MainActivity.java');s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'private boolean unlocked=false,visible=false,authenticating=false,loginRunning=false,destroyed=false,pollBusy=false;', 'private boolean unlocked=AppSession.isUnlocked(),visible=false,authenticating=false,loginRunning=false,destroyed=false,pollBusy=false;',s,count=1);assert n==1,'unlock field'
          s,n=re.subn(r'@Override protected void onResume\(\)\{super\.onResume\(\);visible=true;if\(store==null\)return;', '@Override protected void onResume(){super.onResume();visible=true;if(AppSession.isUnlocked())unlocked=true;if(store==null)return;',s,count=1);assert n==1,'onResume'
          if s.count('unlocked=true;begin();')<2: raise SystemExit('auth success count')
          s=s.replace('unlocked=true;begin();','unlocked=true;AppSession.unlock();begin();')
          s=s.replace('store.reset();cache.clear();','store.reset();AppSession.lock();unlocked=false;cache.clear();',1)
          pat=r'  gap\(page,16\);TextView moneyTitle=.*?(?=  JSONObject update=object\(boot,"update"\);)'
          home='''  gap(page,16);TextView workTitle=text("QUICK ACTIONS",11,MUTED);workTitle.setTypeface(null,Typeface.BOLD);workTitle.setLetterSpacing(.10f);page.addView(workTitle);gap(page,8);\n  quick(page,"search","Search everything","Customers, invoices, orders, items and LR/RR numbers",()->startActivity(new Intent(this,UniversalSearchActivity.class)));\n  quick(page,"Reports","New order","Create an order quickly • works offline",()->{Intent i=new Intent(this,OrdersActivity.class);i.setAction(OrdersActivity.ACTION_QUICK);startActivity(i);});\n  quick(page,"health","Today's work","Pending orders, dispatch, business status and items needing attention",()->startActivity(new Intent(this,WorkActivity.class)));\n  quick(page,"calculator","GSM calculator","Calculate towel GSM from size and weight • offline",()->startActivity(new Intent(this,GsmCalculatorActivity.class)));\n  quick(page,"Proforma","Proforma invoice","Create and share a proforma invoice",()->rootTab("Proforma"));\n  gap(page,10);TextView moneyTitle=text("MONEY OVERVIEW",11,MUTED);moneyTitle.setTypeface(null,Typeface.BOLD);moneyTitle.setLetterSpacing(.10f);page.addView(moneyTitle);gap(page,8);\n  metric(page,"Receivable",amountOrMissing(sm,"receivable"),time(sm.optString("rFetchedAt")),"receive",true,()->open(()->outstanding("receivable")));\n  metric(page,"Payable",amountOrMissing(sm,"payable"),time(sm.optString("pFetchedAt")),"pay",false,()->open(()->outstanding("payable")));\n  metric(page,"Sales this month",amountOrMissing(sm,"sales"),time(sm.optString("sFetchedAt")),"Reports",false,()->open(()->register("sales")));\n  gap(page,8);TextView reportTitle=text("REPORTS & MORE",11,MUTED);reportTitle.setTypeface(null,Typeface.BOLD);reportTitle.setLetterSpacing(.10f);page.addView(reportTitle);gap(page,8);\n  quick(page,"Reports","Sales register","Month-wise invoices with verified totals",()->open(()->register("sales")));\n  quick(page,"share","Today's dispatch","Open and share today's invoices",()->open(this::dispatch));\n  quick(page,"health","Company health",healthLine,()->open(this::healthScreen));\n'''
          s,n=re.subn(pat,lambda m:home,s,count=1,flags=re.S);assert n==1,'home block'
          p.write_text(s,encoding='utf-8')

          # 5x1 final widget in actual TallyBridge palette.
          Path('android/app/src/main/java/in/tallybridge/app/QuickDockWidget.java').write_text('''package in.tallybridge.app;import android.app.PendingIntent;import android.appwidget.*;import android.content.*;import android.widget.RemoteViews;public final class QuickDockWidget extends AppWidgetProvider{private static PendingIntent p(Context c,int r,Intent i){return PendingIntent.getActivity(c,r,i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);}@Override public void onUpdate(Context c,AppWidgetManager m,int[] ids){for(int id:ids){RemoteViews v=new RemoteViews(c.getPackageName(),R.layout.quick_dock_widget);v.setOnClickPendingIntent(R.id.quick_dock_brand,p(c,7100+id,new Intent(c,MainActivity.class).setAction(MainActivity.ACTION_HOME)));v.setOnClickPendingIntent(R.id.quick_dock_order,p(c,7200+id,new Intent(c,OrdersActivity.class).setAction(OrdersActivity.ACTION_NEW)));v.setOnClickPendingIntent(R.id.quick_dock_gsm,p(c,7300+id,new Intent(c,GsmCalculatorActivity.class)));v.setOnClickPendingIntent(R.id.quick_dock_proforma,p(c,7400+id,new Intent(c,MainActivity.class).setAction(MainActivity.ACTION_NEW_PROFORMA)));m.updateAppWidget(id,v);}}}\n''',encoding='utf-8')
          Path('android/app/src/main/res/layout/quick_dock_widget.xml').write_text('''<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal" android:baselineAligned="false" android:weightSum="5" android:padding="5dp" android:background="@drawable/quick_dock_bg"><LinearLayout android:id="@+id/quick_dock_brand" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="2" android:gravity="center_vertical" android:orientation="horizontal" android:paddingLeft="12dp" android:paddingRight="10dp" android:background="@drawable/quick_dock_brand"><ImageView android:layout_width="34dp" android:layout_height="34dp" android:src="@drawable/app_icon" android:contentDescription="TallyBridge"/><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginLeft="9dp" android:text="TallyBridge" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="17sp" android:maxLines="1" android:ellipsize="end"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="›" android:textColor="#9BDCCA" android:textStyle="bold" android:textSize="28sp"/></LinearLayout><LinearLayout android:id="@+id/quick_dock_order" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_marginLeft="5dp" android:gravity="center" android:orientation="vertical" android:background="@drawable/quick_dock_order"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="+" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="25sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Add Order" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp"/></LinearLayout><LinearLayout android:id="@+id/quick_dock_gsm" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_marginLeft="5dp" android:gravity="center" android:orientation="vertical" android:background="@drawable/quick_dock_gsm"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="GSM" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="16sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Calculator" android:textColor="#D7E7EA" android:textStyle="bold" android:textSize="9sp"/></LinearLayout><LinearLayout android:id="@+id/quick_dock_proforma" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_marginLeft="5dp" android:gravity="center" android:orientation="vertical" android:background="@drawable/quick_dock_proforma"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="₹" android:textColor="#9BDCCA" android:textStyle="bold" android:textSize="20sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Proforma" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp"/></LinearLayout></LinearLayout>''',encoding='utf-8')
          d=Path('android/app/src/main/res/drawable'); shapes={'quick_dock_bg.xml':('#0D2233','#345A6B'),'quick_dock_brand.xml':('#102D44','#2D627A'),'quick_dock_order.xml':('#176B5B','#4A9B88'),'quick_dock_gsm.xml':('#174B5D','#3A7B89'),'quick_dock_proforma.xml':('#193B50','#477387')}
          for n,(fill,stroke) in shapes.items(): (d/n).write_text(f'<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="{fill}"/><corners android:radius="15dp"/><stroke android:width="1dp" android:color="{stroke}"/></shape>\n',encoding='utf-8')
          Path('android/app/src/main/res/xml/quick_dock_widget_info.xml').write_text('<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="300dp" android:minHeight="70dp" android:minResizeWidth="250dp" android:minResizeHeight="70dp" android:targetCellWidth="5" android:targetCellHeight="1" android:updatePeriodMillis="0" android:initialLayout="@layout/quick_dock_widget" android:resizeMode="horizontal" android:widgetCategory="home_screen"/>\n',encoding='utf-8')
          p=Path('android/app/src/main/AndroidManifest.xml');s=p.read_text(encoding='utf-8');mark='        <receiver android:name=".ProformaWidget" android:exported="false">\n';assert mark in s;s=s.replace(mark,'        <receiver android:name=".QuickDockWidget" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/quick_dock_widget_info" /></receiver>\n'+mark,1);p.write_text(s,encoding='utf-8')
          p=Path('android/app/src/androidTest/java/in/tallybridge/app/OrdersOfflineTest.java');s=p.read_text(encoding='utf-8');mark='capture("35-widget-voice-order-1x1");';assert mark in s;s=s.replace(mark,mark+'\n  ui(()->{OrdersActivity a=rule.getActivity();FrameLayout stage=new FrameLayout(a);stage.setBackgroundColor(Color.rgb(232,237,242));View widget=a.getLayoutInflater().inflate(R.layout.quick_dock_widget,stage,false);int w=Math.round(390*a.getResources().getDisplayMetrics().density),h=Math.round(92*a.getResources().getDisplayMetrics().density);stage.addView(widget,new FrameLayout.LayoutParams(w,h,Gravity.CENTER));a.setContentView(stage);});capture("36-widget-quick-dock-5x1");',1);p.write_text(s,encoding='utf-8')
          PY
          gofmt -w internal/app/types.go internal/app/store.go internal/app/autosync.go internal/app/server.go internal/app/sync_company_test.go
          go test ./internal/app
          cd android && gradle --no-daemon test assembleDebug lintDebug
      - name: Commit patch
        run: |
          git config user.name "Vipul Shegur"
          git config user.email "vsshegur@gmail.com"
          git add internal/app android/app
          git commit -m "Finalize TallyBridge 2.5.1 core"
          git push origin final-2.5.1
