name: Verify Orders 2.3.4 fixes
on:
  push:
    branches: [fix/orders-rate-dispatch-edit]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply guarded Orders patch
        run: |
          python3 scripts/orders-234-fix.py
          gofmt -w internal/app/orders.go internal/app/orders_test.go internal/app/types.go
      - name: Verify backend and desktop
        run: |
          node --check internal/app/web/orders.js
          go test ./internal/app
          go vet ./internal/app ./cmd/tallybridge
          GOOS=windows GOARCH=amd64 go build -o /tmp/tallybridge.exe ./cmd/tallybridge
          test -s /tmp/tallybridge.exe
      - name: Build Android and instrumentation tests
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug assembleDebugAndroidTest
      - name: Run Android Orders regression on emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tallybridge-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat /tmp/emulator.log || true' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n orders234 -k "system-images;android-30;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd orders234 -skin 1080x1920 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot > /tmp/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/results.txt
          grep -q 'OK (9 tests)' /tmp/results.txt
      - name: Commit verified production source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/orders.go internal/app/orders_test.go internal/app/web/orders.js internal/app/types.go android/app/build.gradle android/app/src/main/java/in/tallybridge/app/OrdersActivity.java android/app/src/main/java/in/tallybridge/app/OfflineOrdersStore.java android/app/src/androidTest/java/in/tallybridge/app/OrdersOfflineTest.java
          git diff --cached --check
          git commit -m "Fix order sharing dispatch and editing in 2.3.4"
          git push origin HEAD:fix/orders-rate-dispatch-edit
