name: Validate committed TallyBridge 2.4.1 repair

on:
  push:
    branches: [fix/invoice-widget-signing-20261003]
    paths: [.github/workflows/validate-241-current.yml]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Go tests
        run: go test -v ./internal/app
      - name: Go vet
        run: go vet ./internal/app ./cmd/tallybridge ./cmd/uninstall
      - name: Android tests build and lint
        working-directory: android
        run: gradle --no-daemon test assembleDebug lintDebug
      - name: Repair behavior guards
        run: |
          grep -q 'AllInventoryEntries.GSTItemHSNCodeEx' internal/app/tally.go
          grep -q 'GSTITEMHSNCODEEX' internal/app/tally.go
          grep -q 'customerAddressLines(r)' internal/app/tally.go
          ! grep -q 'Read-only copy of data returned by TallyPrime' internal/app/pdf.go
          grep -q 'onStop(){super.onStop();visible=false;}' android/app/src/main/java/in/tallybridge/app/MainActivity.java
          grep -q 'android:minResizeHeight="150dp"' android/app/src/main/res/xml/orders_widget_info.xml
          grep -q "versionName '2.4.1'" android/app/build.gradle
          grep -q 'const Version = "2.4.1"' internal/app/types.go
