name: Verify Orders dark mode redesign
on:
  push:
    branches: [ui/orders-dark-mode-widget]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply guarded Orders UI patch when needed
        run: |
          if grep -q 'const Version = "2.3.1"' internal/app/types.go; then
            python3 scripts/orders-dark-mode-upgrade.py
          else
            echo "Orders UI source already upgraded"
          fi
      - name: Build and lint Android
        working-directory: android
        run: gradle --no-daemon test assembleDebug assembleDebugAndroidTest lintDebug
      - name: Test backend version alignment
        run: |
          go test ./internal/app
          GOOS=windows GOARCH=amd64 go build ./cmd/tallybridge
      - name: Run all native Android tests and capture Orders screens
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tallybridge-orders-ui"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat /tmp/emulator.log || true' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n ordersui -k "system-images;android-30;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd ordersui -skin 1080x1920 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -no-metrics > /tmp/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w in.tallybridge.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/orders-ui-results.txt
          grep -q 'OK (9 tests)' /tmp/orders-ui-results.txt
          mkdir -p android/orders-ui-proof
          for screen in 19-orders-offline 21-orders-widget 23-orders-dark 24-orders-dispatched-dark 25-orders-widget-dark; do
            adb exec-out run-as in.tallybridge.app cat "files/ui/$screen.png" > "android/orders-ui-proof/$screen.png"
            test -s "android/orders-ui-proof/$screen.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-2.3.2-Orders-UI-Proof
          path: android/orders-ui-proof/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TallyBridge-2.3.2-Android-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit verified production source only
        run: |
          git checkout -- .github/workflows/build.yml scripts/orders-dark-mode-upgrade.py .github/workflows/orders-ui-temp.yml
          git config user.name "TallyBridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/build.gradle \
                  android/app/src/main/java/in/tallybridge/app/OrdersActivity.java \
                  android/app/src/main/java/in/tallybridge/app/PhotoOrderActivity.java \
                  android/app/src/main/java/in/tallybridge/app/MainActivity.java \
                  android/app/src/androidTest/java/in/tallybridge/app/OrdersOfflineTest.java \
                  internal/app/types.go
          if git diff --cached --quiet; then
            echo "Verified source already committed"
          else
            git diff --cached --check
            git commit -m "Redesign Orders and widget for light and dark mode"
            git push origin HEAD:ui/orders-dark-mode-widget
          fi
