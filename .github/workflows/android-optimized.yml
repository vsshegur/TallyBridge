name: Android optimized unsigned build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optimized-unsigned:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only to attach the APK to the private preview release
    env:
      TB_ALLOW_UNSIGNED_RELEASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint R8 optimized release
        working-directory: android
        run: |
          gradle --no-daemon test assembleRelease lintRelease
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          EXPECTED_CODE=$(sed -nE "s/.*versionCode ([0-9]+).*/\1/p" app/build.gradle | head -1)
          EXPECTED_NAME=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle | head -1)
          "$AAPT" dump badging "$APK" | tee app/build/outputs/apk/release/APK-VERSION.txt
          grep -q "versionCode='$EXPECTED_CODE'" app/build/outputs/apk/release/APK-VERSION.txt
          grep -q "versionName='$EXPECTED_NAME'" app/build/outputs/apk/release/APK-VERSION.txt
          ! grep -q "application-debuggable" app/build/outputs/apk/release/APK-VERSION.txt
          cp "$APK" "app/build/outputs/apk/release/TallyBridge-${EXPECTED_NAME}-R8-optimized-unsigned.apk"
          sha256sum "$APK" > app/build/outputs/apk/release/UNSIGNED-SHA256.txt
      # Release files do not count against Actions artifact storage, so the APK can always be downloaded.
      - name: Attach APK to the preview release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^const Version = "([^"]+)".*/\1/p' internal/app/types.go)
          test -n "$VERSION"
          TAG="preview-$VERSION"
          OUT=android/app/build/outputs/apk/release
          cp "$OUT/UNSIGNED-SHA256.txt" "$OUT/TallyBridge-$VERSION-R8-optimized-unsigned.sha256.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "TallyBridge $VERSION (preview builds)" \
              --notes "Windows installer and Android APK built from main by GitHub Actions. Android APK is unsigned: sign it with the permanent signing kit before installing. See docs/UPDATE_${VERSION//./_}.md." || \
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" "$OUT/TallyBridge-$VERSION-R8-optimized-unsigned.apk" "$OUT/TallyBridge-$VERSION-R8-optimized-unsigned.sha256.txt" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # the release above is the download; this copy is a convenience
        with:
          retention-days: 14
          name: TallyBridge-Android-R8-Unsigned
          path: |
            android/app/build/outputs/apk/release/TallyBridge-*-R8-optimized-unsigned.apk
            android/app/build/outputs/apk/release/APK-VERSION.txt
            android/app/build/outputs/apk/release/UNSIGNED-SHA256.txt
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
