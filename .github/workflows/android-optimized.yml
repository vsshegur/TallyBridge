name: Android optimized unsigned build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optimized-unsigned:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only to attach the APK to the private preview release
    env:
      # Signed with the permanent key when the four repository secrets are set; otherwise an unsigned APK.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      TB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      TB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # SHA-1 of the permanent TallyBridge key (android/PERMANENT_SIGNING_IDENTITY.txt); Google sign-in is tied to it.
      TB_EXPECTED_SHA1: 55cc4a6d74685143a7e1e914b739cfc6ff4f2abe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore the permanent signing key (when configured)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$TB_STORE_PASSWORD" ] && [ -n "$TB_KEY_ALIAS" ] && [ -n "$TB_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tallybridge-release.jks"
            chmod 600 "$RUNNER_TEMP/tallybridge-release.jks"
            echo "TB_KEYSTORE=$RUNNER_TEMP/tallybridge-release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Building a signed APK with the permanent key."
          else
            echo "TB_ALLOW_UNSIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Signing secrets are not set, so this APK is unsigned. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD under Settings → Secrets and variables → Actions."
          fi
      - name: Check the signing key (when configured)
        if: env.SIGNED == 'true'
        run: |
          # Clear messages for the usual mistakes; prints only public facts (alias names, certificate SHA-1), never secrets.
          KS="$TB_KEYSTORE"
          test -s "$KS" || { echo "::error title=Signing key::ANDROID_KEYSTORE_BASE64 decoded to an empty file"; exit 1; }
          echo "::notice title=Signing key::keystore file is $(stat -c %s "$KS") bytes ($(file -b "$KS" | cut -c1-60))"
          if ! keytool -list -keystore "$KS" -storepass "$TB_STORE_PASSWORD" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error title=Signing key::keytool cannot open the keystore: $(grep -m1 -iE 'exception|error|password' "$RUNNER_TEMP/ks.txt" | cut -c1-200). Check ANDROID_KEYSTORE_PASSWORD, and that ANDROID_KEYSTORE_BASE64 is the whole .jks file in base64."
            exit 1
          fi
          ALIASES=$(grep -E 'PrivateKeyEntry' "$RUNNER_TEMP/ks.txt" | cut -d, -f1 | paste -sd ' ' -)
          echo "::notice title=Signing key::aliases in the keystore: ${ALIASES:-none}"
          if ! keytool -list -v -keystore "$KS" -storepass "$TB_STORE_PASSWORD" -alias "$TB_KEY_ALIAS" > "$RUNNER_TEMP/alias.txt" 2>&1; then
            echo "::error title=Signing key::alias in ANDROID_KEY_ALIAS was not found. Aliases in the keystore: ${ALIASES:-none}"
            exit 1
          fi
          SHA1=$(sed -nE 's/^\s*SHA1: ([0-9A-F:]+).*/\1/p' "$RUNNER_TEMP/alias.txt" | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "::notice title=Signing key::certificate SHA-1 $SHA1"
          if [ "$SHA1" != "$TB_EXPECTED_SHA1" ]; then echo "::error title=Signing key::this keystore's certificate ($SHA1) is not the permanent TallyBridge key ($TB_EXPECTED_SHA1)"; exit 1; fi
          rm -f "$RUNNER_TEMP/ks.txt" "$RUNNER_TEMP/alias.txt"
      - name: Build and lint R8 optimized release
        working-directory: android
        run: |
          set -o pipefail
          trap 'echo "::error title=Build step::stopped at: $BASH_COMMAND"' ERR
          if ! gradle --no-daemon test assembleRelease lintRelease 2>&1 | tee "$RUNNER_TEMP/gradle.txt"; then
            grep -A4 "What went wrong" "$RUNNER_TEMP/gradle.txt" | grep -v "^--$" | head -6 | while IFS= read -r l; do echo "::error title=Gradle::$l"; done
            exit 1
          fi
          OUT=app/build/outputs/apk/release
          if [ "$SIGNED" = true ]; then APK=$OUT/app-release.apk; else APK=$OUT/app-release-unsigned.apk; fi
          echo "::notice title=APK output::$(ls $OUT | paste -sd ' ' -)"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          EXPECTED_CODE=$(sed -nE "s/.*versionCode ([0-9]+).*/\1/p" app/build.gradle | head -1)
          EXPECTED_NAME=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle | head -1)
          "$AAPT" dump badging "$APK" | tee $OUT/APK-VERSION.txt
          grep -q "versionCode='$EXPECTED_CODE'" $OUT/APK-VERSION.txt
          grep -q "versionName='$EXPECTED_NAME'" $OUT/APK-VERSION.txt
          ! grep -q "application-debuggable" $OUT/APK-VERSION.txt
          if [ "$SIGNED" = true ]; then
            # Refuse to publish an APK signed with any key other than the permanent one.
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee $OUT/SIGNATURE.txt
            grep -qE "Verified using v(2|3|3\.1) scheme \(APK Signature Scheme v[0-9.]+\): true" $OUT/SIGNATURE.txt  # minSdk 28: v3 alone is valid
            ACTUAL=$(sed -nE 's/^.*Signer.* certificate SHA-1 digest: ([0-9a-f]+).*/\1/p' $OUT/SIGNATURE.txt | head -1)  # "Signer #1: …" or "V3.0 Signer: …"
            if [ "$ACTUAL" != "$TB_EXPECTED_SHA1" ]; then echo "::error::APK was signed with $ACTUAL, not the permanent TallyBridge key $TB_EXPECTED_SHA1"; exit 1; fi
            cp "$APK" "$OUT/TallyBridge-${EXPECTED_NAME}.apk"
            (cd $OUT && sha256sum "TallyBridge-${EXPECTED_NAME}.apk" > "TallyBridge-${EXPECTED_NAME}.sha256.txt")
          else
            cp "$APK" "$OUT/TallyBridge-${EXPECTED_NAME}-R8-optimized-unsigned.apk"
            (cd $OUT && sha256sum "TallyBridge-${EXPECTED_NAME}-R8-optimized-unsigned.apk" > "TallyBridge-${EXPECTED_NAME}-R8-optimized-unsigned.sha256.txt")
          fi
          rm -f "$RUNNER_TEMP/tallybridge-release.jks"
      # Release files do not count against Actions artifact storage, so the APK can always be downloaded.
      - name: Attach APK to the preview release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^const Version = "([^"]+)".*/\1/p' internal/app/types.go)
          test -n "$VERSION"
          TAG="preview-$VERSION"
          OUT=android/app/build/outputs/apk/release
          if [ "$SIGNED" = true ]; then NAME="TallyBridge-$VERSION"; else NAME="TallyBridge-$VERSION-R8-optimized-unsigned"; fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "TallyBridge $VERSION (preview builds)" \
              --notes "Windows installer and Android APK built from main by GitHub Actions. See docs/UPDATE_${VERSION//./_}.md." || \
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" "$OUT/$NAME.apk" "$OUT/$NAME.sha256.txt" --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$SIGNED" = true ]; then
            # A signed APK replaces the unsigned one, so there is only one file to install.
            for old in "TallyBridge-$VERSION-R8-optimized-unsigned.apk" "TallyBridge-$VERSION-R8-optimized-unsigned.sha256.txt"; do
              gh release delete-asset "$TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            done
          fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # the release above is the download; this copy is a convenience
        with:
          retention-days: 14
          name: TallyBridge-Android-R8
          path: |
            android/app/build/outputs/apk/release/TallyBridge-*.apk
            android/app/build/outputs/apk/release/APK-VERSION.txt
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
