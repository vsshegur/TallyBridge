plugins { id 'com.android.application' }
android {
    namespace 'in.tallybridge.app'
    compileSdk 35
    defaultConfig {
        applicationId 'in.tallybridge.app'
        minSdk 28
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 20003
        versionName '2.0.3-dark-preview'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('TB_KEYSTORE')) {
                storeFile file(System.getenv('TB_KEYSTORE'))
                storePassword System.getenv('TB_STORE_PASSWORD')
                keyAlias System.getenv('TB_KEY_ALIAS')
                keyPassword System.getenv('TB_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
