plugins { id 'com.android.application' }
def releaseSigningEnabled = System.getenv('TB_KEYSTORE') != null && !System.getenv('TB_KEYSTORE').isEmpty()
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def unsignedReleaseAllowed = System.getenv('TB_ALLOW_UNSIGNED_RELEASE') == 'true'
if (releaseTaskRequested && !releaseSigningEnabled && !unsignedReleaseAllowed) {
    throw new GradleException('Release builds require the permanent TallyBridge signing keystore (or TB_ALLOW_UNSIGNED_RELEASE=true for an explicitly unsigned CI artifact)')
}
android {
    namespace 'in.tallybridge.app'
    compileSdk 35
    defaultConfig {
        applicationId 'in.tallybridge.app'
        minSdk 28
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 20700
        versionName '2.7.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (releaseSigningEnabled) {
            release {
                storeFile file(System.getenv('TB_KEYSTORE'))
                storePassword System.getenv('TB_STORE_PASSWORD')
                keyAlias System.getenv('TB_KEY_ALIAS')
                keyPassword System.getenv('TB_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningEnabled) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
